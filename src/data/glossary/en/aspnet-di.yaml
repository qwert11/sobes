dependency-injection:
  term: Dependency injection (DI)
  def: >-
    A technique where an object receives its dependencies from outside, usually through its
    constructor, instead of creating them itself. In ASP.NET Core the built-in container creates and
    passes the dependencies.
  q: dependency injection ASP.NET Core
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/overview
  wiki: Dependency injection
di-container:
  term: DI container (service container)
  def: >-
    An object that creates services from registered rules, passes them their dependencies and
    manages their lifetimes. In .NET registrations go into `IServiceCollection`, and the container
    is `IServiceProvider`.
  q: .NET IServiceProvider service container
  docs: https://learn.microsoft.com/dotnet/api/system.iserviceprovider
dependency-inversion:
  term: Dependency inversion principle (DIP)
  def: >-
    The D in SOLID: high-level modules do not depend on low-level modules; both depend on
    abstractions. Dependency injection is the practical way to follow it.
  q: dependency inversion principle
  docs: https://learn.microsoft.com/dotnet/architecture/modern-web-apps-azure/architectural-principles#dependency-inversion
  wiki: Dependency inversion principle
constructor-injection:
  term: Constructor injection
  def: >-
    A form of DI where dependencies arrive as constructor parameters. All of the class's
    dependencies are visible in its signature, and the object cannot exist without them.
  q: constructor injection C#
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/overview#constructor-injection-behavior
inversion-of-control:
  term: Inversion of control (IoC)
  def: >-
    A principle where control over program flow or object creation is handed to a framework: your
    code does not call the library, the framework calls your code. DI is a special case of IoC.
  q: inversion of control
  wiki: Inversion of control
service-locator:
  term: Service Locator
  def: >-
    A pattern where a class asks a global registry for its dependencies, for example through
    `IServiceProvider.GetService`. With DI it is considered an anti-pattern: dependencies are not
    visible in the constructor and errors move to run time.
  q: service locator anti-pattern
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/guidelines#recommendations
  wiki: Service locator pattern
service-lifetime:
  term: Service lifetime
  def: >-
    The rule the container uses to decide when to create a new instance of a service and when to
    dispose of it. .NET has three options: Transient, Scoped and Singleton.
  q: .NET service lifetimes transient scoped singleton
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/service-lifetimes
di-scope:
  term: Scope (DI scope)
  def: >-
    An area inside which scoped services exist as a single instance and at the end of which the
    container disposes of the objects created in it. ASP.NET Core creates a scope for every HTTP
    request.
  q: IServiceScope .NET
  docs: https://learn.microsoft.com/dotnet/api/microsoft.extensions.dependencyinjection.iservicescope
root-provider:
  term: Root service provider
  def: >-
    The `IServiceProvider` created by `builder.Build()`. It lives for the whole lifetime of the app,
    stores singleton services and disposes of them at shutdown.
  q: root service provider scope validation
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/overview#scope-validation
captive-dependency:
  term: Captive dependency
  def: >-
    A configuration error where a long-lived service holds a dependency with a shorter lifetime, for
    example a singleton holding a scoped service. The dependency then lives as long as its owner.
  q: captive dependency
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/guidelines#captive-dependency
scope-validation:
  term: Scope validation (ValidateScopes)
  def: >-
    A `ServiceProviderOptions` setting that makes the container forbid resolving scoped services
    from the root provider and injecting them into singletons. On by default in the Development
    environment.
  q: ValidateScopes ASP.NET Core
  docs: https://learn.microsoft.com/dotnet/api/microsoft.extensions.dependencyinjection.serviceprovideroptions.validatescopes
validate-on-build:
  term: ValidateOnBuild
  def: >-
    A `ServiceProviderOptions` setting that makes the container check during `Build()` that every
    registered service can be created. Open generic registrations are not checked; on by default in
    Development.
  q: ValidateOnBuild .NET
  docs: https://learn.microsoft.com/dotnet/api/microsoft.extensions.dependencyinjection.serviceprovideroptions.validateonbuild
implementation-factory:
  term: Implementation factory
  def: >-
    A `Func<IServiceProvider, T>` delegate passed to `AddSingleton`, `AddScoped` or `AddTransient`
    instead of an implementation type. The container calls it to create the service and disposes
    of the returned object as if it had created it itself.
  q: AddSingleton implementation factory
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/service-registration
service-scope-factory:
  term: IServiceScopeFactory
  def: >-
    A singleton service that creates new scopes. Singletons and background services use it to get
    scoped services: `CreateScope()` or, since .NET 6, `CreateAsyncScope()`.
  q: IServiceScopeFactory CreateAsyncScope
  docs: https://learn.microsoft.com/dotnet/api/microsoft.extensions.dependencyinjection.iservicescopefactory
background-service:
  term: BackgroundService
  def: >-
    A base class for long-running background work in a .NET host: the logic goes into
    `ExecuteAsync`, and it is registered with `AddHostedService`, that is, as a singleton.
  q: BackgroundService .NET
  docs: https://learn.microsoft.com/dotnet/api/microsoft.extensions.hosting.backgroundservice
unit-of-work:
  term: Unit of work
  def: >-
    A set of operations that are performed and saved together as one business transaction. In EF
    Core a `DbContext` instance represents a unit of work.
  q: unit of work pattern
  docs: https://martinfowler.com/eaaCatalog/unitOfWork.html
keyed-services:
  term: Keyed services
  def: >-
    Registrations with a key, added in .NET 8: `AddKeyedSingleton`, `AddKeyedScoped`,
    `AddKeyedTransient`. You get a specific implementation with the `[FromKeyedServices(key)]`
    attribute or `GetRequiredKeyedService`.
  q: .NET 8 keyed services
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/overview#keyed-services
try-add:
  term: TryAdd and TryAddEnumerable
  def: >-
    Registration methods from `Microsoft.Extensions.DependencyInjection.Extensions`. `TryAdd*` adds
    a service only if it is not registered yet, `TryAddEnumerable` only if the same
    service-and-implementation pair is not there.
  q: TryAddEnumerable vs TryAdd
  docs: https://learn.microsoft.com/dotnet/api/microsoft.extensions.dependencyinjection.extensions.servicecollectiondescriptorextensions.tryaddenumerable
decorator-pattern:
  term: Decorator
  def: >-
    A pattern where an object wraps another object with the same interface and adds behaviour
    before or after the call: caching, logging, retries. The built-in .NET container does not
    support decorators.
  q: decorator pattern dependency injection .NET
  wiki: Decorator pattern
scrutor:
  term: Scrutor
  def: >-
    An extension library for the built-in .NET container: assembly scanning with convention-based
    registration (`Scan`) and decorators (`Decorate`).
  q: Scrutor Decorate Scan
  docs: https://github.com/khellang/Scrutor
composition-root:
  term: Composition root
  def: >-
    The single place in an app where the object graph is composed: service registrations and the
    choice of implementations. In ASP.NET Core it is `Program.cs` and the `Add...` extension methods
    it calls.
  q: composition root dependency injection
  docs: https://blog.ploeh.dk/2011/07/28/CompositionRoot/
disposable-transient:
  term: Disposable transient
  def: >-
    A transient service that implements `IDisposable` or `IAsyncDisposable`. The container keeps a
    reference to each such instance until the end of the scope, so when resolved from the root they
    pile up until the app stops.
  q: disposable transient services captured by container
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/guidelines#disposable-transient-services-captured-by-container
autofac:
  term: Autofac
  def: >-
    A popular third-party DI container for .NET. It plugs into ASP.NET Core through
    `UseServiceProviderFactory` and adds modules, decorators, property injection and tagged scopes.
  q: Autofac ASP.NET Core
  docs: https://autofac.readthedocs.io/en/latest/integration/aspnetcore.html
property-injection:
  term: Property injection
  def: >-
    A form of DI where the container assigns dependencies to public properties of an already
    created object. The built-in .NET container does not support it; Autofac does.
  q: property injection C#
activator-utilities:
  term: ActivatorUtilities
  def: >-
    A helper class that creates an object of an unregistered type, taking constructor arguments
    from an `IServiceProvider`. The calling code, not the container, owns the created object.
  q: ActivatorUtilities.CreateInstance
  docs: https://learn.microsoft.com/dotnet/api/microsoft.extensions.dependencyinjection.activatorutilities
