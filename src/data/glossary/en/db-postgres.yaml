identity-column:
  term: Identity column (GENERATED AS IDENTITY)
  def: >-
    A column whose values the database generates from a sequence attached to it. In PostgreSQL it is declared as `GENERATED ALWAYS AS IDENTITY` or `GENERATED BY DEFAULT AS IDENTITY` (since version 10) and replaces the legacy `serial`; the equivalent of `IDENTITY(1,1)` in SQL Server.
  q: PostgreSQL identity column
  docs: https://www.postgresql.org/docs/current/ddl-identity-columns.html
upsert:
  term: Upsert (INSERT ... ON CONFLICT)
  def: >-
    An "insert, or update if the row already exists" operation. In PostgreSQL it is `INSERT ... ON CONFLICT DO UPDATE`, atomic under concurrent inserts thanks to a unique index; in SQL Server it is usually `MERGE` with the `HOLDLOCK` hint.
  q: PostgreSQL INSERT ON CONFLICT upsert
  docs: https://www.postgresql.org/docs/current/sql-insert.html#SQL-ON-CONFLICT
timestamptz:
  term: timestamptz (timestamp with time zone)
  def: >-
    The PostgreSQL type for a point in time. On input the value is converted to UTC, on output to the session time zone; the original offset is not stored, unlike `datetimeoffset` in SQL Server.
  q: PostgreSQL timestamptz
  docs: https://www.postgresql.org/docs/current/datatype-datetime.html
sequence:
  term: Sequence
  def: >-
    A database object that hands out increasing numbers via `nextval`. It works outside transactions: a rollback does not return issued values, so keys can have gaps. Identity columns and `serial` are built on sequences.
  q: PostgreSQL sequence nextval setval
  docs: https://www.postgresql.org/docs/current/sql-createsequence.html
search-path:
  term: search_path
  def: >-
    A PostgreSQL setting with the list of schemas searched for objects referenced without a schema. By default it is the schema named after the user plus `public`; the closest SQL Server equivalent is a user's default schema, usually `dbo`.
  q: PostgreSQL search_path schema
  docs: https://www.postgresql.org/docs/current/ddl-schemas.html#DDL-SCHEMAS-PATH
collation:
  term: Collation
  def: >-
    Rules for comparing and sorting strings for a language. In PostgreSQL regular collations are deterministic and case-sensitive; case-insensitive matching comes from a nondeterministic ICU collation, the `citext` type, or `lower()`.
  q: PostgreSQL collation nondeterministic case insensitive
  docs: https://www.postgresql.org/docs/current/collation.html
  wiki: Collation
mvcc:
  term: MVCC (multi-version concurrency control)
  def: >-
    A transaction isolation approach in which the database keeps several versions of a row and each transaction sees the version that is current for its snapshot. Readers don't block writers and vice versa. In PostgreSQL old versions live in the table itself; in SQL Server with RCSI, in a separate version store.
  q: PostgreSQL MVCC
  docs: https://www.postgresql.org/docs/current/mvcc-intro.html
  wiki: Multiversion concurrency control
dead-tuple:
  term: Dead tuple
  def: >-
    A row version deleted or replaced by a committed transaction that no active transaction can see anymore. It takes up space in the table and indexes until VACUUM removes it.
  q: PostgreSQL dead tuples
  docs: https://www.postgresql.org/docs/current/routine-vacuuming.html
vacuum:
  term: VACUUM
  def: >-
    A PostgreSQL maintenance command: it removes dead row versions, updates the visibility map and freezes old rows to protect against transaction counter overflow. Usually it is run by the background autovacuum process.
  q: PostgreSQL VACUUM autovacuum
  docs: https://www.postgresql.org/docs/current/sql-vacuum.html
table-bloat:
  term: Bloat
  def: >-
    Space in a table or index occupied by dead versions and the gaps they leave. Queries read extra pages; plain VACUUM reuses the space but does not return it to the OS.
  q: PostgreSQL table bloat
  docs: https://www.postgresql.org/docs/current/routine-vacuuming.html#VACUUM-FOR-SPACE-RECOVERY
xid-wraparound:
  term: Transaction ID wraparound
  def: >-
    PostgreSQL transaction IDs are 32-bit and compared circularly, so after ~2 billion transactions old rows would appear to be "from the future". VACUUM freezes them in advance; if it falls behind, the database stops accepting write transactions.
  q: PostgreSQL transaction ID wraparound
  docs: https://www.postgresql.org/docs/current/routine-vacuuming.html#VACUUM-FOR-WRAPAROUND
hot-update:
  term: HOT update (heap-only tuple)
  def: >-
    An update in which the new row version goes on the same page and creates no index entries. It is possible when no indexed column changed and the page has free space.
  q: PostgreSQL HOT update fillfactor
  docs: https://www.postgresql.org/docs/current/storage-hot.html
heap-table:
  term: Heap table
  def: >-
    A table whose rows are stored without ordering by a key. In PostgreSQL every table is a heap, and indexes, the primary key included, point to the physical address of a row version (`ctid`).
  q: PostgreSQL heap table ctid
  docs: https://www.postgresql.org/docs/current/storage-page-layout.html
gin-index:
  term: GIN index
  def: >-
    A Generalized Inverted Index: for each element — a word, an array element, a JSONB key — it stores the list of rows where it occurs. Fast at answering "contains", but expensive to write.
  q: PostgreSQL GIN index
  docs: https://www.postgresql.org/docs/current/gin.html
gist-index:
  term: GiST index
  def: >-
    A Generalized Search Tree — a framework for indexes on geometry, ranges and full-text data. Supports overlap, containment and nearest-neighbor search.
  q: PostgreSQL GiST index
  docs: https://www.postgresql.org/docs/current/gist.html
brin-index:
  term: BRIN index
  def: >-
    A Block Range Index: stores the minimum and maximum for each group of adjacent table pages. Very small, but useful only when values correlate with the physical row order, like timestamps in a log.
  q: PostgreSQL BRIN index
  docs: https://www.postgresql.org/docs/current/brin.html
partial-index:
  term: Partial index
  def: >-
    An index over only the rows that satisfy the `WHERE` condition in its definition. Smaller than a full index and used by queries with a compatible condition; the equivalent of a SQL Server filtered index.
  q: PostgreSQL partial index
  docs: https://www.postgresql.org/docs/current/indexes-partial.html
expression-index:
  term: Expression index
  def: >-
    An index on the result of an expression or function, such as `lower(email)`. It is used only when the query contains the same expression; in SQL Server this requires a computed column.
  q: PostgreSQL expression index
  docs: https://www.postgresql.org/docs/current/indexes-expressional.html
jsonb:
  term: jsonb
  def: >-
    The PostgreSQL type for JSON in parsed binary form: no duplicate keys and no original order, but with search operators (`@>`, `?`, `@?`) and GIN index support. The `json` type, by contrast, stores the original text.
  q: PostgreSQL jsonb
  docs: https://www.postgresql.org/docs/current/datatype-json.html
jsonpath:
  term: jsonpath (SQL/JSON path)
  def: >-
    The path language from the SQL/JSON standard for selecting and filtering values inside JSON, such as `$.items[*] ? (@.price > 10)`. In PostgreSQL it is understood by the `@?` and `@@` operators and by functions such as `jsonb_path_query`, `JSON_VALUE` and `JSON_EXISTS`.
  q: PostgreSQL jsonpath
  docs: https://www.postgresql.org/docs/current/datatype-json.html#DATATYPE-JSONPATH
toast:
  term: TOAST
  def: >-
    PostgreSQL's mechanism for storing large values: when a row is wider than ~2 KB, large fields are compressed and moved to a separate internal table. Changing such a value rewrites it entirely.
  q: PostgreSQL TOAST
  docs: https://www.postgresql.org/docs/current/storage-toast.html
eav:
  term: EAV (entity–attribute–value)
  def: >-
    A schema in which attributes are stored as "entity, attribute name, value" rows instead of separate columns. Flexible, but awkward to query and untyped; JSONB often replaces it.
  q: entity attribute value model
  wiki: Entity–attribute–value model
explain-analyze:
  term: EXPLAIN ANALYZE
  def: >-
    A PostgreSQL command that runs the query and prints the plan with actual time, row counts and loops at every node. With the `BUFFERS` option (on by default since version 18) it also shows page reads.
  q: PostgreSQL EXPLAIN ANALYZE BUFFERS
  docs: https://www.postgresql.org/docs/current/using-explain.html
pg-stat-statements:
  term: pg_stat_statements
  def: >-
    A PostgreSQL extension that accumulates execution statistics per normalized query: calls, total and mean time, rows, block reads. The closest equivalent of Query Store, but it does not store plans.
  q: pg_stat_statements
  docs: https://www.postgresql.org/docs/current/pgstatstatements.html
work-mem:
  term: work_mem
  def: >-
    A PostgreSQL setting for how much memory a single sort or hash operation may use before spilling to disk. It is allocated per such operation in every connection, so large values are set selectively.
  q: PostgreSQL work_mem
  docs: https://www.postgresql.org/docs/current/runtime-config-resource.html#GUC-WORK-MEM
auto-explain:
  term: auto_explain
  def: >-
    A PostgreSQL module that automatically logs the plans of queries running longer than a threshold (`auto_explain.log_min_duration`). It lets you see the plan of a slow production query without running it by hand.
  q: PostgreSQL auto_explain
  docs: https://www.postgresql.org/docs/current/auto-explain.html
pgbouncer:
  term: PgBouncer
  def: >-
    A lightweight external connection pooler for PostgreSQL. In `transaction` mode it gives a client a server connection only for the duration of a transaction, so thousands of client connections are served by a small number of server processes.
  q: PgBouncer transaction pooling
  docs: https://www.pgbouncer.org/features.html
xmin-horizon:
  term: xmin horizon
  def: >-
    The ID of the oldest transaction whose snapshot may still be needed: an open transaction, a replication slot or a replica. VACUUM does not remove row versions newer than the horizon, so a single long transaction causes bloat across the whole database.
  q: PostgreSQL xmin horizon long running transaction vacuum
  docs: https://www.postgresql.org/docs/current/routine-vacuuming.html
