solid:
  term: SOLID
  def: >-
    Five object-oriented design principles collected by Robert Martin: single responsibility,
    open/closed, Liskov substitution, interface segregation and dependency inversion. Michael Feathers
    coined the acronym.
  q: SOLID principles
  wiki: SOLID
single-responsibility:
  term: Single Responsibility Principle (SRP)
  def: >-
    The S in SOLID: a module has one reason to change. In Martin's "Clean Architecture" wording, a
    module is responsible to one actor — one group of people who request changes.
  q: single responsibility principle Robert Martin actor
  docs: https://blog.cleancoder.com/uncle-bob/2014/05/08/SingleReponsibilityPrinciple.html
  wiki: Single-responsibility principle
open-closed:
  term: Open/Closed Principle (OCP)
  def: >-
    The O in SOLID: a module is open for extension and closed for modification. Formulated by
    Bertrand Meyer in 1988; Martin achieves it through abstractions and polymorphism.
  q: open closed principle
  docs: https://blog.cleancoder.com/uncle-bob/2014/05/12/TheOpenClosedPrinciple.html
  wiki: Open–closed principle
dry:
  term: DRY (Don't Repeat Yourself)
  def: >-
    A principle from "The Pragmatic Programmer" (1999): every piece of knowledge must have a single,
    unambiguous, authoritative representation within a system. It is about knowledge and rules, not
    identical lines of code.
  q: DRY principle knowledge Pragmatic Programmer
  docs: https://learn.microsoft.com/dotnet/architecture/modern-web-apps-azure/architectural-principles#dont-repeat-yourself-dry
  wiki: Don't repeat yourself
kiss:
  term: KISS (Keep It Simple, Stupid)
  def: >-
    An engineering simplicity principle: among working solutions, pick the simplest. The phrase is
    attributed to Kelly Johnson, an engineer at Lockheed.
  q: KISS principle software
  wiki: KISS principle
yagni:
  term: YAGNI (You Aren't Gonna Need It)
  def: >-
    An Extreme Programming rule: do not implement functionality until it is needed. It does not
    forbid refactoring and tests that make future changes easier.
  q: YAGNI Martin Fowler
  docs: https://martinfowler.com/bliki/Yagni.html
  wiki: You aren't gonna need it
rule-of-three:
  term: Rule of three
  def: >-
    A refactoring heuristic: tolerate two similar fragments, extract the common part on the third.
    Attributed to Don Roberts and popularized by Martin Fowler in "Refactoring".
  q: rule of three refactoring
  wiki: Rule of three (computer programming)
design-by-contract:
  term: Contract (design by contract)
  def: >-
    Describing a method's behavior through preconditions (what is true before the call),
    postconditions (what is guaranteed after) and invariants (what is always true). Bertrand
    Meyer's approach; LSP rests on it.
  q: design by contract preconditions postconditions invariants
  wiki: Design by contract
interface-segregation:
  term: Interface Segregation Principle (ISP)
  def: >-
    The I in SOLID: a client should not depend on methods it does not use. A wide interface is split
    into several narrow ones shaped by client needs.
  q: interface segregation principle
  wiki: Interface segregation principle
role-interface:
  term: Role interface
  def: >-
    An interface that describes one role an object plays for a specific client, rather than all its
    public methods. The opposite is a header interface, which mirrors the whole class.
  q: role interface Martin Fowler
  docs: https://martinfowler.com/bliki/RoleInterface.html
speculative-generality:
  term: Speculative generality
  def: >-
    A code smell from Fowler's catalog: abstractions, parameters and hooks "for the future" that
    nobody uses. The cure is to remove them.
  q: speculative generality code smell
accidental-complexity:
  term: Accidental complexity
  def: >-
    Complexity introduced by the solution rather than the problem: extra layers, abstractions, tools.
    Contrasted with essential complexity in Fred Brooks's essay "No Silver Bullet" (1986).
  q: accidental vs essential complexity Brooks
  wiki: No Silver Bullet
cupid:
  term: CUPID
  def: >-
    Properties of "joyful" code proposed by Dan North as an alternative to SOLID: Composable, Unix
    philosophy, Predictable, Idiomatic, Domain-based. They are properties code moves toward, not
    rules it complies with.
  q: CUPID Dan North
  docs: https://dannorth.net/blog/cupid-for-joyful-coding/
