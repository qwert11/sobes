solid:
  term: SOLID
  def: >-
    П'ять принципів об'єктного проєктування, зібраних Робертом Мартіном: єдина відповідальність,
    відкритість/закритість, підстановка Лісков, розділення інтерфейсів та інверсія залежностей.
    Абревіатуру запропонував Майкл Фезерс.
  q: SOLID principles
  wiki: SOLID (об'єктно-орієнтоване програмування)
single-responsibility:
  term: Принцип єдиної відповідальності (SRP)
  def: >-
    Літера S у SOLID: модуль має одну причину для зміни. У формулюванні Мартіна з «Clean
    Architecture» — модуль відповідає перед одним актором, тобто перед однією групою людей, які
    просять змін.
  q: single responsibility principle Robert Martin actor
  docs: https://blog.cleancoder.com/uncle-bob/2014/05/08/SingleReponsibilityPrinciple.html
  wiki: Принцип єдиного обов'язку
open-closed:
  term: Принцип відкритості/закритості (OCP)
  def: >-
    Літера O у SOLID: модуль відкритий для розширення й закритий для зміни. Сформульований
    Бертраном Меєром у 1988 році; Мартін досягає його через абстракції та поліморфізм.
  q: open closed principle
  docs: https://blog.cleancoder.com/uncle-bob/2014/05/12/TheOpenClosedPrinciple.html
  wiki: Принцип відкритості/закритості
dry:
  term: DRY (Don't Repeat Yourself)
  def: >-
    Принцип із книжки «The Pragmatic Programmer» (1999): кожне знання повинно мати єдине,
    однозначне, авторитетне представлення в системі. Стосується знань і правил, а не однакових
    рядків коду.
  q: DRY principle knowledge Pragmatic Programmer
  docs: https://learn.microsoft.com/dotnet/architecture/modern-web-apps-azure/architectural-principles#dont-repeat-yourself-dry
kiss:
  term: KISS (Keep It Simple, Stupid)
  def: >-
    Принцип інженерної простоти: з робочих рішень обирати найпростіше. Фразу приписують Келлі
    Джонсону, інженерові Lockheed.
  q: KISS principle software
yagni:
  term: YAGNI (You Aren't Gonna Need It)
  def: >-
    Правило екстремального програмування: не реалізовувати функціональність, доки вона не потрібна.
    Не забороняє рефакторинг і тести, які спрощують майбутні зміни.
  q: YAGNI Martin Fowler
  docs: https://martinfowler.com/bliki/Yagni.html
  wiki: YAGNI
rule-of-three:
  term: Правило трьох (rule of three)
  def: >-
    Евристика рефакторингу: два схожі фрагменти терплять, на третьому виносять спільне.
    Приписується Дону Робертсу, популяризована Мартіном Фаулером у книжці «Рефакторинг».
  q: rule of three refactoring
design-by-contract:
  term: Контракт (design by contract)
  def: >-
    Опис поведінки методу через передумови (що істинне до виклику), післяумови (що гарантовано
    після) та інваріанти (що істинне завжди). Підхід Бертрана Меєра; на ньому тримається LSP.
  q: design by contract preconditions postconditions invariants
interface-segregation:
  term: Принцип розділення інтерфейсів (ISP)
  def: >-
    Літера I у SOLID: клієнт не повинен залежати від методів, якими не користується. Широкий
    інтерфейс ділять на кілька вузьких за потребами клієнтів.
  q: interface segregation principle
role-interface:
  term: Рольовий інтерфейс (role interface)
  def: >-
    Інтерфейс, який описує одну роль об'єкта для конкретного клієнта, а не всі його публічні
    методи. Протилежність — заголовковий інтерфейс (header interface), що копіює клас повністю.
  q: role interface Martin Fowler
  docs: https://martinfowler.com/bliki/RoleInterface.html
speculative-generality:
  term: Спекулятивна загальність (speculative generality)
  def: >-
    Запах коду з каталогу Фаулера: абстракції, параметри й хуки «на майбутнє», якими ніхто не
    користується. Лікується видаленням зайвого.
  q: speculative generality code smell
accidental-complexity:
  term: Випадкова складність (accidental complexity)
  def: >-
    Складність, яку вносить рішення, а не задача: зайві шари, абстракції, інструменти.
    Протиставлена суттєвій складності в есеї Фреда Брукса «No Silver Bullet» (1986).
  q: accidental vs essential complexity Brooks
cupid:
  term: CUPID
  def: >-
    Властивості «приємного» коду, запропоновані Деном Нортом як альтернатива SOLID: Composable, Unix
    philosophy, Predictable, Idiomatic, Domain-based. Це властивості, до яких код наближається, а не
    правила, яких він дотримується.
  q: CUPID Dan North
  docs: https://dannorth.net/blog/cupid-for-joyful-coding/
