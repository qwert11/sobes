identity-column:
  term: Identity-стовпець (GENERATED AS IDENTITY)
  def: >-
    Стовпець, значення якого база генерує сама з прив'язаної до нього послідовності. У PostgreSQL оголошується як `GENERATED ALWAYS AS IDENTITY` або `GENERATED BY DEFAULT AS IDENTITY` (з версії 10) і замінює застарілий `serial`; аналог `IDENTITY(1,1)` у SQL Server.
  q: PostgreSQL identity column
  docs: https://www.postgresql.org/docs/current/ddl-identity-columns.html
upsert:
  term: Upsert (INSERT ... ON CONFLICT)
  def: >-
    Операція «вставити, а якщо такий рядок уже є — оновити». У PostgreSQL це `INSERT ... ON CONFLICT DO UPDATE`, атомарний за паралельних вставок завдяки унікальному індексу; у SQL Server зазвичай `MERGE` з підказкою `HOLDLOCK`.
  q: PostgreSQL INSERT ON CONFLICT upsert
  docs: https://www.postgresql.org/docs/current/sql-insert.html#SQL-ON-CONFLICT
timestamptz:
  term: timestamptz (timestamp with time zone)
  def: >-
    Тип PostgreSQL для моменту часу. Під час введення значення переводиться в UTC, під час виведення — у часовий пояс сесії; вихідний зсув не зберігається, на відміну від `datetimeoffset` у SQL Server.
  q: PostgreSQL timestamptz
  docs: https://www.postgresql.org/docs/current/datatype-datetime.html
sequence:
  term: Послідовність (sequence)
  def: >-
    Об'єкт бази, який видає зростаючі числа через `nextval`. Працює поза транзакціями: відкат не повертає видані значення, тому в ключах бувають пропуски. На послідовностях побудовано identity і `serial`.
  q: PostgreSQL sequence nextval setval
  docs: https://www.postgresql.org/docs/current/sql-createsequence.html
search-path:
  term: search_path
  def: >-
    Параметр PostgreSQL зі списком схем, у яких шукаються об'єкти, указані без схеми. За замовчуванням це схема з ім'ям користувача та `public`; найближчий аналог у SQL Server — схема за замовчуванням у користувача, зазвичай `dbo`.
  q: PostgreSQL search_path schema
  docs: https://www.postgresql.org/docs/current/ddl-schemas.html#DDL-SCHEMAS-PATH
collation:
  term: Правило сортування (collation)
  def: >-
    Правила порівняння й сортування рядків для мови. У PostgreSQL звичайні collation детерміновані й розрізняють регістр; пошук без урахування регістру дає недетермінована ICU-collation, тип `citext` або `lower()`.
  q: PostgreSQL collation nondeterministic case insensitive
  docs: https://www.postgresql.org/docs/current/collation.html
mvcc:
  term: MVCC (багатоверсійне керування паралельним доступом)
  def: >-
    Спосіб ізоляції транзакцій, за якого база зберігає кілька версій рядка, і кожна транзакція бачить версію, актуальну для її знімка. Читачі не блокують записувачів і навпаки. У PostgreSQL старі версії лежать у самій таблиці, у SQL Server з RCSI — в окремому сховищі версій.
  q: PostgreSQL MVCC
  docs: https://www.postgresql.org/docs/current/mvcc-intro.html
  wiki: MVCC
dead-tuple:
  term: Мертва версія рядка (dead tuple)
  def: >-
    Версія рядка, видалена або замінена завершеною транзакцією, яку вже не бачить жодна активна транзакція. Займає місце в таблиці та індексах, доки її не прибере VACUUM.
  q: PostgreSQL dead tuples
  docs: https://www.postgresql.org/docs/current/routine-vacuuming.html
vacuum:
  term: VACUUM
  def: >-
    Команда обслуговування PostgreSQL: прибирає мертві версії рядків, оновлює карту видимості й заморожує старі рядки, захищаючи від переповнення лічильника транзакцій. Зазвичай її запускає фоновий процес autovacuum.
  q: PostgreSQL VACUUM autovacuum
  docs: https://www.postgresql.org/docs/current/sql-vacuum.html
table-bloat:
  term: Розбухання таблиці (bloat)
  def: >-
    Місце в таблиці чи індексі, зайняте мертвими версіями й порожнечами після них. Запити читають зайві сторінки; звичайний VACUUM місце перевикористовує, але ОС не повертає.
  q: PostgreSQL table bloat
  docs: https://www.postgresql.org/docs/current/routine-vacuuming.html#VACUUM-FOR-SPACE-RECOVERY
xid-wraparound:
  term: Переповнення лічильника транзакцій (XID wraparound)
  def: >-
    Номери транзакцій у PostgreSQL 32-бітні й порівнюються по колу, тому через ~2 млрд транзакцій старі рядки здавалися б «з майбутнього». VACUUM заздалегідь заморожує їх; якщо не встигає, база перестає приймати транзакції, що пишуть.
  q: PostgreSQL transaction ID wraparound
  docs: https://www.postgresql.org/docs/current/routine-vacuuming.html#VACUUM-FOR-WRAPAROUND
hot-update:
  term: HOT-оновлення (heap-only tuple)
  def: >-
    Оновлення, за якого нова версія рядка лягає на ту саму сторінку й не створює записів в індексах. Можливе, якщо не змінилася жодна індексована колонка й на сторінці є місце.
  q: PostgreSQL HOT update fillfactor
  docs: https://www.postgresql.org/docs/current/storage-hot.html
heap-table:
  term: Таблиця-купа (heap)
  def: >-
    Таблиця, рядки якої зберігаються без упорядкування за ключем. У PostgreSQL усі таблиці — купи, а індекси, включно з первинним ключем, посилаються на фізичну адресу версії рядка (`ctid`).
  q: PostgreSQL heap table ctid
  docs: https://www.postgresql.org/docs/current/storage-page-layout.html
gin-index:
  term: GIN-індекс
  def: >-
    Обернений індекс (Generalized Inverted Index): для кожного елемента — слова, елемента масиву, ключа JSONB — зберігає список рядків, де він трапляється. Швидко відповідає на «містить», але дорогий на запис.
  q: PostgreSQL GIN index
  docs: https://www.postgresql.org/docs/current/gin.html
gist-index:
  term: GiST-індекс
  def: >-
    Узагальнене дерево пошуку (Generalized Search Tree) — каркас для індексів за геометрією, діапазонами й повнотекстовими даними. Підтримує перетин, вкладення й пошук найближчих сусідів.
  q: PostgreSQL GiST index
  docs: https://www.postgresql.org/docs/current/gist.html
brin-index:
  term: BRIN-індекс
  def: >-
    Індекс діапазонів блоків (Block Range Index): зберігає мінімум і максимум для кожної групи сусідніх сторінок таблиці. Дуже маленький, але корисний, лише якщо значення корелюють із фізичним порядком рядків, як час у журналі.
  q: PostgreSQL BRIN index
  docs: https://www.postgresql.org/docs/current/brin.html
partial-index:
  term: Частковий індекс (partial index)
  def: >-
    Індекс лише за рядками, що задовольняють умову `WHERE` у його визначенні. Менший за повний і використовується запитами із сумісною умовою; аналог фільтрованого індексу SQL Server.
  q: PostgreSQL partial index
  docs: https://www.postgresql.org/docs/current/indexes-partial.html
expression-index:
  term: Індекс за виразом (expression index)
  def: >-
    Індекс за результатом виразу або функції, наприклад `lower(email)`. Використовується, лише якщо запит містить той самий вираз; у SQL Server для цього потрібен обчислюваний стовпець.
  q: PostgreSQL expression index
  docs: https://www.postgresql.org/docs/current/indexes-expressional.html
jsonb:
  term: jsonb
  def: >-
    Тип PostgreSQL для JSON у розібраному двійковому вигляді: без дублів ключів і вихідного порядку, зате з операторами пошуку (`@>`, `?`, `@?`) і підтримкою GIN-індексів. Тип `json`, навпаки, зберігає вихідний текст.
  q: PostgreSQL jsonb
  docs: https://www.postgresql.org/docs/current/datatype-json.html
jsonpath:
  term: jsonpath (SQL/JSON path)
  def: >-
    Мова шляхів зі стандарту SQL/JSON для вибору й фільтрації значень усередині JSON, наприклад `$.items[*] ? (@.price > 10)`. У PostgreSQL її розуміють оператори `@?`, `@@` і функції `jsonb_path_query`, `JSON_VALUE`, `JSON_EXISTS`.
  q: PostgreSQL jsonpath
  docs: https://www.postgresql.org/docs/current/datatype-json.html#DATATYPE-JSONPATH
toast:
  term: TOAST
  def: >-
    Механізм зберігання великих значень у PostgreSQL: якщо рядок ширший за ~2 КБ, великі поля стискаються й виносяться в окрему службову таблицю. Зміна такого значення переписує його цілком.
  q: PostgreSQL TOAST
  docs: https://www.postgresql.org/docs/current/storage-toast.html
eav:
  term: EAV (entity–attribute–value)
  def: >-
    Схема, у якій атрибути зберігаються рядками вигляду «сутність, ім'я атрибута, значення» замість окремих колонок. Гнучка, але незручна для запитів і без типізації; JSONB часто її замінює.
  q: entity attribute value model
explain-analyze:
  term: EXPLAIN ANALYZE
  def: >-
    Команда PostgreSQL, яка виконує запит і виводить план із фактичними часом, кількістю рядків і проходів на кожному вузлі. З опцією `BUFFERS` (з версії 18 — за замовчуванням) показує й читання сторінок.
  q: PostgreSQL EXPLAIN ANALYZE BUFFERS
  docs: https://www.postgresql.org/docs/current/using-explain.html
pg-stat-statements:
  term: pg_stat_statements
  def: >-
    Розширення PostgreSQL, яке накопичує статистику виконання за нормалізованими запитами: виклики, сумарний і середній час, рядки, читання блоків. Найближчий аналог Query Store, але без зберігання планів.
  q: pg_stat_statements
  docs: https://www.postgresql.org/docs/current/pgstatstatements.html
work-mem:
  term: work_mem
  def: >-
    Параметр PostgreSQL: скільки пам'яті може зайняти одна операція сортування чи хешування, перш ніж піти на диск. Виділяється на кожну таку операцію в кожному з'єднанні, тому великі значення задають точково.
  q: PostgreSQL work_mem
  docs: https://www.postgresql.org/docs/current/runtime-config-resource.html#GUC-WORK-MEM
auto-explain:
  term: auto_explain
  def: >-
    Модуль PostgreSQL, який автоматично пише в журнал плани запитів, довших за заданий поріг (`auto_explain.log_min_duration`). Дає змогу побачити план повільного запиту в продакшені без ручного запуску.
  q: PostgreSQL auto_explain
  docs: https://www.postgresql.org/docs/current/auto-explain.html
pgbouncer:
  term: PgBouncer
  def: >-
    Легкий зовнішній пул з'єднань для PostgreSQL. У режимі `transaction` віддає клієнтові серверне з'єднання лише на час транзакції, тому тисячі клієнтських з'єднань обслуговує невелика кількість серверних процесів.
  q: PgBouncer transaction pooling
  docs: https://www.pgbouncer.org/features.html
xmin-horizon:
  term: Горизонт xmin (xmin horizon)
  def: >-
    Номер найстарішої транзакції, чий знімок ще може знадобитися: відкритої транзакції, слота реплікації або репліки. VACUUM не видаляє версії рядків, новіші за горизонт, тому одна довга транзакція спричиняє bloat у всій базі.
  q: PostgreSQL xmin horizon long running transaction vacuum
  docs: https://www.postgresql.org/docs/current/routine-vacuuming.html
