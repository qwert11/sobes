box-model:
  term: Блокова модель (box model)
  def: >-
    Подання кожного елемента в CSS як прямокутника з вмісту, внутрішнього відступу (padding),
    рамки (border) і зовнішнього відступу (margin). Що входить у `width`, задає `box-sizing`.
  q: CSS box model
  docs: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Box_model/Introduction
flexbox:
  term: Flexbox
  def: >-
    Модуль розкладки CSS для однієї осі: діти контейнера з `display: flex` вишиковуються в рядок
    або колонку й ділять вільне місце за `flex-grow` і `flex-shrink`.
  q: CSS flexbox basic concepts
  docs: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Flexible_box_layout/Basic_concepts
css-grid:
  term: CSS Grid
  def: >-
    Модуль розкладки CSS для двох осей: контейнер із `display: grid` задає рядки й колонки,
    а діти займають клітинки й області сітки.
  q: CSS grid layout
  docs: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Grid_layout
css-specificity:
  term: Специфічність селектора (specificity)
  def: >-
    Вага селектора в каскаді — трійка «id, класи й атрибути й псевдокласи, теги й псевдоелементи».
    За однакового походження й шару перемагає правило з більшою специфічністю.
  q: CSS specificity
  docs: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Cascade/Specificity
media-query:
  term: Медіазапит (media query)
  def: >-
    Умова `@media`, за якої застосовуються стилі: ширина вікна, орієнтація, тип пристрою,
    темна тема. Основа адаптивної верстки.
  q: CSS media queries
  docs: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Media_queries/Using
container-query:
  term: Контейнерний запит (container query)
  def: >-
    Умова `@container`, яка перевіряє розмір найближчого предка з `container-type`, а не вікна.
    Дає змогу компоненту підлаштовуватися під місце, куди його поставили.
  q: CSS container queries
  docs: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Containment/Container_queries
screen-reader:
  term: Скринрідер (screen reader)
  def: >-
    Програма, яка озвучує інтерфейс або виводить його на брайлівський дисплей: NVDA, JAWS,
    VoiceOver, TalkBack. Читає дерево доступності, а не пікселі.
  q: screen reader web accessibility
  docs: https://developer.mozilla.org/en-US/docs/Glossary/Screen_reader
semantic-html:
  term: Семантичний HTML
  def: >-
    Розмітка елементами за змістом: `button`, `nav`, `main`, `label`, заголовки — замість `div` і `span`.
    Дає роль, поведінку клавіатури й структуру для скринрідерів без додаткового коду.
  q: semantic HTML accessibility
  docs: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Accessibility/HTML
accessibility-tree:
  term: Дерево доступності (accessibility tree)
  def: >-
    Структура, яку браузер будує з DOM для допоміжних технологій: кожен вузол має роль,
    доступне ім'я, опис і стан.
  q: accessibility tree browser
  docs: https://developer.mozilla.org/en-US/docs/Glossary/Accessibility_tree
wai-aria:
  term: WAI-ARIA
  def: >-
    Специфікація W3C з атрибутами `role` і `aria-*`, які доповнюють дерево доступності там, де
    HTML бракує семантики. Змінює лише те, що чує скринрідер, але не поведінку елемента.
  q: WAI-ARIA basics
  docs: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA
wcag:
  term: WCAG (Web Content Accessibility Guidelines)
  def: >-
    Стандарт W3C з перевірюваними критеріями доступності рівнів A, AA і AAA. Актуальна версія — WCAG 2.2
    (жовтень 2023); закони зазвичай вимагають рівня AA.
  q: WCAG 2.2
  docs: https://www.w3.org/TR/WCAG22/
european-accessibility-act:
  term: Європейський акт про доступність (European Accessibility Act, EAA)
  def: >-
    Директива ЄС 2019/882, яка з 28 червня 2025 року вимагає доступності низки продуктів і послуг:
    інтернет-магазинів, банків, транспорту, електронних книг. Технічна опора — EN 301 549.
  q: European Accessibility Act
  docs: https://eur-lex.europa.eu/eli/dir/2019/882/oj
cssom:
  term: CSSOM (CSS Object Model)
  def: >-
    Дерево правил, яке браузер будує з усіх стилів сторінки. Разом із DOM воно потрібне, щоб
    побудувати дерево відмальовування, тому CSS блокує перший показ сторінки.
  q: CSSOM CSS object model
  docs: https://developer.mozilla.org/en-US/docs/Web/API/CSS_Object_Model
critical-rendering-path:
  term: Критичний шлях відмальовування (critical rendering path)
  def: >-
    Кроки браузера від отримання HTML до першого кадру: DOM, CSSOM, дерево відмальовування, layout,
    paint, composite. Його довжину визначають блокувальні CSS і скрипти.
  q: critical rendering path
  docs: https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/Critical_rendering_path
render-blocking-resource:
  term: Блокувальний ресурс (render-blocking resource)
  def: >-
    Ресурс, без якого браузер не почне відмальовування: стилі в `head` і синхронні скрипти. Скрипти
    з `defer`, `async` і модулі не блокують.
  q: render-blocking resources
  docs: https://developer.mozilla.org/en-US/docs/Glossary/Render_blocking
reflow:
  term: Reflow (перерахунок розкладки)
  def: >-
    Повторний розрахунок розмірів і положення елементів (layout) після зміни геометрії або DOM.
    Дорожчий за repaint, який лише перемальовує пікселі.
  q: reflow repaint browser
  docs: https://developer.mozilla.org/en-US/docs/Glossary/Reflow
layout-thrashing:
  term: Layout thrashing
  def: >-
    Чергування запису стилів і читання геометрії (`offsetHeight`, `getBoundingClientRect`), за якого
    браузер синхронно перераховує layout на кожному читанні.
  q: layout thrashing forced synchronous layout
  docs: https://web.dev/articles/avoid-large-complex-layouts-and-layout-thrashing
compositing:
  term: Композитинг (compositing)
  def: >-
    Збирання кадру з готових шарів в окремому потоці композитора. Зміни `transform` і `opacity`
    шару обходяться без layout і paint.
  q: browser compositing layers
  docs: https://web.dev/articles/stick-to-compositor-only-properties-and-manage-layer-count
core-web-vitals:
  term: Core Web Vitals
  def: >-
    Три метрики Google для користувацького досвіду: LCP (швидкість завантаження), INP (відгук) і CLS
    (стабільність верстки). Оцінюються за 75-м перцентилем реальних візитів.
  q: Core Web Vitals
  docs: https://web.dev/articles/vitals
lcp:
  term: LCP (Largest Contentful Paint)
  def: >-
    Час від початку навігації до відмальовування найбільшого зображення або текстового блока
    в області перегляду. Добре — до 2,5 секунди.
  q: Largest Contentful Paint
  docs: https://web.dev/articles/lcp
inp:
  term: INP (Interaction to Next Paint)
  def: >-
    Затримка від кліку, дотику чи натискання клавіші до наступного кадру, найгірша за візит. Добре —
    до 200 мс. У березні 2024 року замінила FID у Core Web Vitals.
  q: Interaction to Next Paint
  docs: https://web.dev/articles/inp
cls:
  term: CLS (Cumulative Layout Shift)
  def: >-
    Міра неочікуваних зсувів верстки: найбільша серія зсувів за час життя сторінки.
    Добре — до 0,1.
  q: Cumulative Layout Shift
  docs: https://web.dev/articles/cls
real-user-monitoring:
  term: RUM (real user monitoring)
  def: >-
    Збирання метрик продуктивності в браузерах реальних користувачів і надсилання їх в аналітику.
    Дає польові дані на відміну від лабораторних вимірів Lighthouse.
  q: real user monitoring web performance
  docs: https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/Rum-vs-Synthetic
code-splitting:
  term: Поділ коду (code splitting)
  def: >-
    Розбиття бандла на частини, які завантажуються на вимогу через динамічний `import()`:
    за маршрутами або за рідко вживаними функціями. Зменшує стартовий обсяг JS.
  q: code splitting dynamic import
  docs: https://developer.mozilla.org/en-US/docs/Glossary/Code_splitting
