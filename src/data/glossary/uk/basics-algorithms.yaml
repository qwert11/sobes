space-complexity:
  term: Складність за пам'яттю (space complexity)
  def: >-
    Оцінка того, скільки додаткової пам'яті потребує алгоритм зі зростанням входу n, без урахування самого входу. Прохід із `HashSet<T>` — O(n) пам'яті, подвійний цикл без колекцій — O(1).
  q: space complexity algorithm
worst-case:
  term: Найгірший випадок (worst case)
  def: >-
    Оцінка складності на найневдалішому вході заданого розміру. Дає гарантію для будь-якого вводу: quicksort у середньому O(n log n), але в найгіршому випадку O(n²).
  q: worst case complexity
  wiki: Обчислювальна складність
master-theorem:
  term: Основна теорема про рекурентні співвідношення (master theorem)
  def: >-
    Готова відповідь для рекурентних співвідношень вигляду T(n) = a·T(n/b) + f(n), які описують алгоритми «розділяй і володарюй». Наприклад, сортування злиттям T(n) = 2T(n/2) + O(n) дає O(n log n).
  q: master theorem algorithms
binary-search-tree:
  term: Двійкове дерево пошуку (binary search tree)
  def: >-
    Дерево, де в кожного вузла ключі ліворуч менші, а праворуч більші. Пошук, вставка й видалення коштують O(висоти): O(log n) у збалансованого дерева й O(n) у виродженого.
  q: binary search tree
  wiki: Двійкове дерево пошуку
binary-heap:
  term: Двійкова купа (binary heap)
  def: >-
    Дерево, що зберігається в масиві, де кожен батько не більший за своїх нащадків, тому мінімум лежить у корені. Вставка й вилучення мінімуму — O(log n). У .NET на купі побудовано `PriorityQueue<TElement, TPriority>`.
  q: binary heap priority queue
  docs: https://learn.microsoft.com/dotnet/api/system.collections.generic.priorityqueue-2
  wiki: Двійкова купа
graph:
  term: Граф (graph)
  def: >-
    Набір вершин і ребер між ними: міста й дороги, задачі й залежності, користувачі та зв'язки. Ребра бувають напрямленими й зваженими; готового типу графа в .NET немає.
  q: graph data structure
  wiki: Граф (математика)
adjacency-list:
  term: Список суміжності (adjacency list)
  def: >-
    Спосіб зберігати граф: для кожної вершини — список її сусідів, у C# зазвичай `Dictionary<T, List<T>>`. Займає O(V + E) пам'яті й підходить для розріджених графів.
  q: adjacency list graph
binary-search:
  term: Бінарний пошук (binary search)
  def: >-
    Пошук у відсортованому масиві поділом діапазону навпіл: порівняти із серединою й відкинути половину, де елемента бути не може. Працює за O(log n); у .NET — `Array.BinarySearch` і `List<T>.BinarySearch`.
  q: binary search algorithm
  docs: https://learn.microsoft.com/dotnet/api/system.array.binarysearch
  wiki: Двійковий пошук
quicksort:
  term: Швидке сортування (quicksort)
  def: >-
    Сортування, яке обирає опорний елемент, розкладає решту на менші й більші та рекурсивно сортує частини. У середньому O(n log n) на місці, у найгіршому O(n²); нестабільне.
  q: quicksort algorithm
  wiki: Швидке сортування
merge-sort:
  term: Сортування злиттям (merge sort)
  def: >-
    Сортування, яке ділить масив навпіл, сортує половини й зливає їх. Завжди O(n log n) і стабільне, але потребує O(n) додаткової пам'яті.
  q: merge sort algorithm
  wiki: Сортування злиттям
stable-sort:
  term: Стабільне сортування (stable sort)
  def: >-
    Сортування, яке зберігає початковий порядок елементів із рівними ключами. `Enumerable.OrderBy` стабільний, а `Array.Sort` і `List<T>.Sort` — ні.
  q: stable sorting algorithm
heapsort:
  term: Пірамідальне сортування (heapsort)
  def: >-
    Сортування, яке будує купу з масиву й раз у раз вилучає з неї крайній елемент. O(n log n) у найгіршому випадку й O(1) додаткової пам'яті, але нестабільне.
  q: heapsort algorithm
  wiki: Пірамідальне сортування
introsort:
  term: Інтроспективне сортування (introsort)
  def: >-
    Гібридне сортування в `Array.Sort`: quicksort, який на малих ділянках перемикається на вставки, а за надто глибокого розбиття — на heapsort. Дає O(n log n) у найгіршому випадку, нестабільне.
  q: introsort .NET Array.Sort
  docs: https://learn.microsoft.com/dotnet/api/system.array.sort
recursion:
  term: Рекурсія (recursion)
  def: >-
    Прийом, за якого функція викликає саму себе для меншої підзадачі. Потрібні базовий випадок без рекурсії й крок, що до нього наближає; кожен виклик займає кадр стека.
  q: recursion programming
  wiki: Рекурсія
dynamic-programming:
  term: Динамічне програмування (dynamic programming)
  def: >-
    Метод розв'язання задач, які складаються з підзадач, що перекриваються: відповідь кожної підзадачі обчислюють один раз і перевикористовують. Перетворює експоненційний перебір на поліноміальний алгоритм.
  q: dynamic programming
  wiki: Динамічне програмування
memoization:
  term: Мемоізація (memoization)
  def: >-
    Кешування результатів функції за аргументами: повторний виклик з тими самими аргументами бере відповідь зі словника або масиву. Це ДП згори донизу — рекурсія плюс кеш.
  q: memoization
  wiki: Мемоізація
tabulation:
  term: Табуляція (tabulation)
  def: >-
    ДП знизу вгору: таблицю відповідей заповнюють циклом від базових випадків до цільового, без рекурсії. Дає змогу зберігати лише останні рядки таблиці й економити пам'ять.
  q: dynamic programming tabulation bottom-up
tail-call:
  term: Хвостовий виклик (tail call)
  def: >-
    Виклик, що стоїть останньою дією функції, тому її кадр стека можна перевикористати. Компілятор C# такої оптимізації не гарантує, тому глибоку рекурсію в C# переписують циклом.
  q: tail call optimization C#
  wiki: Хвостова рекурсія
two-pointers:
  term: Два вказівники (two pointers)
  def: >-
    Прийом, за якого два індекси рухаються масивом назустріч один одному або в один бік. Розв'язує задачі на відсортованих масивах за O(n) і O(1) пам'яті: пара із заданою сумою, паліндром, злиття.
  q: two pointers technique
sliding-window:
  term: Ковзне вікно (sliding window)
  def: >-
    Прийом для задач про підвідрізки: вікно [left, right] розширюється праворуч і стискається зліва, коли умову порушено. Кожен індекс зсувається не більше одного разу, тому O(n).
  q: sliding window technique
prefix-sum:
  term: Префіксні суми (prefix sums)
  def: >-
    Масив, де елемент i — сума перших i елементів початкового. Після підготовки за O(n) суму будь-якого відрізка рахують за O(1) як різницю двох префіксів.
  q: prefix sum array
bfs:
  term: Пошук у ширину (BFS, breadth-first search)
  def: >-
    Обхід графа шарами через чергу: спершу всі сусіди, потім сусіди сусідів. Знаходить найкоротший шлях за кількістю ребер у незваженому графі за O(V + E).
  q: breadth-first search
  wiki: Пошук у ширину
dfs:
  term: Пошук у глибину (DFS, depth-first search)
  def: >-
    Обхід графа, який іде однією гілкою до кінця й повертається назад, через рекурсію або явний стек. O(V + E); основа для пошуку циклів, компонент зв'язності й топологічного сортування.
  q: depth-first search
  wiki: Пошук у глибину
topological-sort:
  term: Топологічне сортування (topological sort)
  def: >-
    Впорядкування вершин орієнтованого графа без циклів так, щоб кожне ребро йшло від ранішої вершини до пізнішої. Алгоритм Кана робить це за O(V + E) і заразом знаходить цикли.
  q: topological sort Kahn algorithm
  wiki: Топологічне сортування
