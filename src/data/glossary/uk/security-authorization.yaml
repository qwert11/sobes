rbac:
  term: RBAC (рольова модель доступу)
  def: >-
    Role-based access control: права збирають у ролі, а користувачам призначають ролі. Модель NIST
    закріплена стандартом ANSI INCITS 359 і, крім базового рівня, описує ієрархії ролей і розділення
    обов'язків.
  q: role-based access control NIST
  docs: https://csrc.nist.gov/projects/role-based-access-control
  wiki: Керування доступом на основі ролей
default-policy:
  term: Політика за замовчуванням (default policy)
  def: >-
    Політика, яку ASP.NET Core застосовує до `[Authorize]` і `RequireAuthorization()` без назви
    політики. За замовчуванням вимагає лише автентифікованого користувача, змінюється через
    `SetDefaultPolicy`.
  q: ASP.NET Core authorization default policy
  docs: https://learn.microsoft.com/aspnet/core/security/authorization/policies#default-and-fallback-policies
fallback-policy:
  term: Fallback policy (резервна політика)
  def: >-
    Політика для ендпоінтів без метаданих авторизації. За замовчуванням її немає, і такі ендпоінти
    відкриті; `SetFallbackPolicy` з `RequireAuthenticatedUser` закриває все, що не позначено явно.
  q: ASP.NET Core fallback authorization policy
  docs: https://learn.microsoft.com/aspnet/core/security/authorization/policies#require-global-user-authentication
claim:
  term: Claim (твердження про суб'єкт)
  def: >-
    Пара «тип — значення» про користувача чи сервіс, видана довіреним видавцем: ім'я, email, відділ,
    роль. Описує, хто суб'єкт, а не що йому можна; у .NET це клас `Claim`.
  q: claims-based identity .NET
  docs: https://learn.microsoft.com/dotnet/api/system.security.claims.claim
claims-principal:
  term: ClaimsPrincipal
  def: >-
    Користувач у .NET: одна або кілька `ClaimsIdentity`. В ASP.NET Core це `HttpContext.User`; методи
    `IsInRole`, `HasClaim` і `FindFirst` шукають серед claims усіх його identity.
  q: ClaimsPrincipal .NET
  docs: https://learn.microsoft.com/dotnet/api/system.security.claims.claimsprincipal
claims-identity:
  term: ClaimsIdentity
  def: >-
    Набір claims, отриманих одним способом автентифікації. Зберігає `AuthenticationType` (без нього
    identity не вважається автентифікованою), а також `NameClaimType` і `RoleClaimType`.
  q: ClaimsIdentity .NET
  docs: https://learn.microsoft.com/dotnet/api/system.security.claims.claimsidentity
claims-transformation:
  term: Трансформація claims (IClaimsTransformation)
  def: >-
    Інтерфейс ASP.NET Core: його `TransformAsync` викликається після успішної автентифікації й може
    доповнити principal даними застосунку. Спрацьовує на кожному запиті, іноді кілька разів, тому має
    бути ідемпотентним.
  q: IClaimsTransformation ASP.NET Core
  docs: https://learn.microsoft.com/aspnet/core/security/authentication/claims#extend-or-add-custom-claims-using-iclaimstransformation
authorization-policy:
  term: Політика авторизації (authorization policy)
  def: >-
    Іменований набір вимог (requirements) в ASP.NET Core. Реєструється через
    `AddAuthorizationBuilder().AddPolicy`, застосовується атрибутом `[Authorize(Policy = "...")]` або
    `RequireAuthorization` і виконана, коли виконані всі її вимоги.
  q: ASP.NET Core policy-based authorization
  docs: https://learn.microsoft.com/aspnet/core/security/authorization/policies
authorization-requirement:
  term: Вимога авторизації (authorization requirement)
  def: >-
    Клас із маркерним інтерфейсом `IAuthorizationRequirement`: описує правило та його параметри,
    наприклад потрібне право чи мінімальний вік. Саму перевірку виконують handlers.
  q: IAuthorizationRequirement ASP.NET Core
  docs: https://learn.microsoft.com/aspnet/core/security/authorization/policies#requirements-and-policy-registration
authorization-handler:
  term: Обробник авторизації (authorization handler)
  def: >-
    Реалізація `IAuthorizationHandler`, зазвичай нащадок `AuthorizationHandler<TRequirement>`: перевіряє
    requirement і викликає `context.Succeed` або `context.Fail`. Реєструється в DI; один requirement
    може мати кілька handlers.
  q: AuthorizationHandler ASP.NET Core
  docs: https://learn.microsoft.com/aspnet/core/security/authorization/policies#authorization-handlers
resource-based-authorization:
  term: Авторизація за ресурсом (resource-based authorization)
  def: >-
    Перевірка доступу до конкретного об'єкта — документа, заявки — після його завантаження. В ASP.NET
    Core виконується в коді викликом `IAuthorizationService.AuthorizeAsync(user, resource, policy)`.
  q: ASP.NET Core resource-based authorization
  docs: https://learn.microsoft.com/aspnet/core/security/authorization/resource-based
role-explosion:
  term: Вибух ролей (role explosion)
  def: >-
    Неконтрольоване зростання кількості ролей, коли під кожне поєднання посади, відділу, регіону чи
    проєкту заводять окрему роль. Ознака того, що параметр час винести в атрибут (ABAC) або відношення
    (ReBAC).
  q: role explosion RBAC
abac:
  term: ABAC (доступ на основі атрибутів)
  def: >-
    Attribute-based access control: рішення ухвалює правило над атрибутами суб'єкта, об'єкта, операції
    та оточення — відділ, гриф, час, мережа. Модель описана в NIST SP 800-162.
  q: attribute-based access control
  docs: https://csrc.nist.gov/pubs/sp/800/162/upd2/final
rebac:
  term: ReBAC (доступ на основі відношень)
  def: >-
    Relationship-based access control: права виводяться з графа відношень між користувачами й
    об'єктами — «власник», «учасник групи», «тека містить документ». Так влаштовані Google Zanzibar,
    OpenFGA і SpiceDB.
  q: relationship-based access control
  docs: https://openfga.dev/docs/authorization-concepts
zanzibar:
  term: Google Zanzibar
  def: >-
    Глобальна система авторизації Google, описана в статті на USENIX ATC 2019. Зберігає відношення
    кортежами «об'єкт#відношення@користувач», обслуговує Drive, YouTube, Cloud та інші сервіси й стала
    зразком для OpenFGA і SpiceDB.
  q: Zanzibar Google consistent global authorization system
  docs: https://www.usenix.org/conference/atc19/presentation/pang
policy-decision-point:
  term: PDP і PEP (точки ухвалення й застосування рішень)
  def: >-
    Policy decision point обчислює рішення «дозволити чи заборонити», policy enforcement point
    перехоплює запит і застосовує це рішення. Поділ описано в NIST SP 800-162; зовнішнім PDP слугують,
    наприклад, OPA та OpenFGA.
  q: policy decision point policy enforcement point
  docs: https://csrc.nist.gov/pubs/sp/800/162/upd2/final
row-level-security:
  term: Row-level security (RLS)
  def: >-
    Механізм СКБД, який фільтрує рядки таблиці за політикою для поточного користувача або контексту
    сесії: `CREATE POLICY` у PostgreSQL, `CREATE SECURITY POLICY` у SQL Server.
  q: row-level security
  docs: https://www.postgresql.org/docs/current/ddl-rowsecurity.html
least-privilege:
  term: Принцип найменших привілеїв (least privilege)
  def: >-
    Користувач або процес отримує лише ті права, які потрібні для його задачі, і лише на потрібний час.
    У NIST SP 800-53 це контроль AC-6.
  q: principle of least privilege
  docs: https://csrc.nist.gov/glossary/term/least_privilege
privilege-creep:
  term: Накопичення прав (privilege creep)
  def: >-
    Поступове зростання прав працівника: під час переведень і нових проєктів права видають, а старі не
    забирають. Лікується переглядом доступу та відкликанням прав у разі зміни посади.
  q: privilege creep
separation-of-duties:
  term: Розділення обов'язків (separation of duties, SoD)
  def: >-
    Правило, за яким критичну операцію не виконує повністю одна людина: хто створює платіж, той його не
    затверджує. У RBAC — заборона конфліктних ролей в одного користувача (статичне) або в одній сесії
    (динамічне).
  q: separation of duties access control
  docs: https://csrc.nist.gov/glossary/term/separation_of_duty
access-review:
  term: Перегляд доступу (access review)
  def: >-
    Регулярна перевірка виданих прав: керівник або власник ресурсу підтверджує, що права ще потрібні,
    або відкликає їх. Інші назви — recertification, attestation.
  q: user access review recertification
  docs: https://learn.microsoft.com/entra/id-governance/access-reviews-overview
just-in-time-access:
  term: Тимчасовий доступ (just-in-time access)
  def: >-
    Права, що діють обмежений час: видаються з датою завершення або активуються на запит на кілька
    годин. Приклад — Microsoft Entra Privileged Identity Management.
  q: just-in-time privileged access
  docs: https://learn.microsoft.com/entra/id-governance/privileged-identity-management/pim-configure
provisioning:
  term: Provisioning (автоматичне надання доступу)
  def: >-
    Автоматичне створення облікових записів і видача прав у цільових системах — AD, SaaS, внутрішніх
    застосунках — і зворотний процес, відкликання. Стандартний протокол для цього — SCIM (RFC 7643,
    RFC 7644).
  q: user provisioning SCIM
  docs: https://datatracker.ietf.org/doc/html/rfc7644
