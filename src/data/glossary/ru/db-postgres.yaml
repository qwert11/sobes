identity-column:
  term: Identity-столбец (GENERATED AS IDENTITY)
  def: >-
    Столбец, значения которого база генерирует сама из привязанной к нему последовательности. В PostgreSQL объявляется как `GENERATED ALWAYS AS IDENTITY` или `GENERATED BY DEFAULT AS IDENTITY` (с версии 10) и заменяет устаревший `serial`; аналог `IDENTITY(1,1)` в SQL Server.
  q: PostgreSQL identity column
  docs: https://www.postgresql.org/docs/current/ddl-identity-columns.html
upsert:
  term: Upsert (INSERT ... ON CONFLICT)
  def: >-
    Операция «вставить, а если такая строка уже есть — обновить». В PostgreSQL это `INSERT ... ON CONFLICT DO UPDATE`, атомарный при параллельных вставках благодаря уникальному индексу; в SQL Server обычно `MERGE` с подсказкой `HOLDLOCK`.
  q: PostgreSQL INSERT ON CONFLICT upsert
  docs: https://www.postgresql.org/docs/current/sql-insert.html#SQL-ON-CONFLICT
timestamptz:
  term: timestamptz (timestamp with time zone)
  def: >-
    Тип PostgreSQL для момента времени. При вводе значение переводится в UTC, при выводе — в часовой пояс сессии; исходное смещение не сохраняется, в отличие от `datetimeoffset` в SQL Server.
  q: PostgreSQL timestamptz
  docs: https://www.postgresql.org/docs/current/datatype-datetime.html
sequence:
  term: Последовательность (sequence)
  def: >-
    Объект базы, который выдаёт возрастающие числа через `nextval`. Работает вне транзакций: откат не возвращает выданные значения, поэтому в ключах бывают пропуски. На последовательностях построены identity и `serial`.
  q: PostgreSQL sequence nextval setval
  docs: https://www.postgresql.org/docs/current/sql-createsequence.html
search-path:
  term: search_path
  def: >-
    Параметр PostgreSQL со списком схем, в которых ищутся объекты, указанные без схемы. По умолчанию это схема с именем пользователя и `public`; ближайший аналог в SQL Server — схема по умолчанию у пользователя, обычно `dbo`.
  q: PostgreSQL search_path schema
  docs: https://www.postgresql.org/docs/current/ddl-schemas.html#DDL-SCHEMAS-PATH
collation:
  term: Правило сортировки (collation)
  def: >-
    Правила сравнения и сортировки строк для языка. В PostgreSQL обычные collation детерминированные и различают регистр; поиск без учёта регистра даёт недетерминированная ICU-collation, тип `citext` или `lower()`.
  q: PostgreSQL collation nondeterministic case insensitive
  docs: https://www.postgresql.org/docs/current/collation.html
mvcc:
  term: MVCC (многоверсионное управление параллельным доступом)
  def: >-
    Способ изоляции транзакций, при котором база хранит несколько версий строки, и каждая транзакция видит версию, актуальную для её снимка. Читатели не блокируют писателей и наоборот. В PostgreSQL старые версии лежат в самой таблице, в SQL Server с RCSI — в отдельном хранилище версий.
  q: PostgreSQL MVCC
  docs: https://www.postgresql.org/docs/current/mvcc-intro.html
  wiki: MVCC
dead-tuple:
  term: Мёртвая версия строки (dead tuple)
  def: >-
    Версия строки, удалённая или заменённая завершённой транзакцией, которую уже не видит ни одна активная транзакция. Занимает место в таблице и индексах, пока её не уберёт VACUUM.
  q: PostgreSQL dead tuples
  docs: https://www.postgresql.org/docs/current/routine-vacuuming.html
vacuum:
  term: VACUUM
  def: >-
    Команда обслуживания PostgreSQL: убирает мёртвые версии строк, обновляет карту видимости и замораживает старые строки, защищая от переполнения счётчика транзакций. Обычно её запускает фоновый процесс autovacuum.
  q: PostgreSQL VACUUM autovacuum
  docs: https://www.postgresql.org/docs/current/sql-vacuum.html
table-bloat:
  term: Разбухание таблицы (bloat)
  def: >-
    Место в таблице или индексе, занятое мёртвыми версиями и пустотами после них. Запросы читают лишние страницы; обычный VACUUM место переиспользует, но ОС не возвращает.
  q: PostgreSQL table bloat
  docs: https://www.postgresql.org/docs/current/routine-vacuuming.html#VACUUM-FOR-SPACE-RECOVERY
xid-wraparound:
  term: Переполнение счётчика транзакций (XID wraparound)
  def: >-
    Номера транзакций в PostgreSQL 32-битные и сравниваются по кругу, поэтому через ~2 млрд транзакций старые строки показались бы «из будущего». VACUUM заранее замораживает их; если не успевает, база перестаёт принимать пишущие транзакции.
  q: PostgreSQL transaction ID wraparound
  docs: https://www.postgresql.org/docs/current/routine-vacuuming.html#VACUUM-FOR-WRAPAROUND
hot-update:
  term: HOT-обновление (heap-only tuple)
  def: >-
    Обновление, при котором новая версия строки ложится на ту же страницу и не создаёт записей в индексах. Возможно, если не изменилась ни одна индексированная колонка и на странице есть место.
  q: PostgreSQL HOT update fillfactor
  docs: https://www.postgresql.org/docs/current/storage-hot.html
heap-table:
  term: Таблица-куча (heap)
  def: >-
    Таблица, строки которой хранятся без упорядочивания по ключу. В PostgreSQL все таблицы — кучи, а индексы, включая первичный ключ, ссылаются на физический адрес версии строки (`ctid`).
  q: PostgreSQL heap table ctid
  docs: https://www.postgresql.org/docs/current/storage-page-layout.html
gin-index:
  term: GIN-индекс
  def: >-
    Обратный индекс (Generalized Inverted Index): для каждого элемента — слова, элемента массива, ключа JSONB — хранит список строк, где он встречается. Быстро отвечает на «содержит», но дорог на запись.
  q: PostgreSQL GIN index
  docs: https://www.postgresql.org/docs/current/gin.html
gist-index:
  term: GiST-индекс
  def: >-
    Обобщённое дерево поиска (Generalized Search Tree) — каркас для индексов по геометрии, диапазонам и полнотекстовым данным. Поддерживает пересечение, вложение и поиск ближайших соседей.
  q: PostgreSQL GiST index
  docs: https://www.postgresql.org/docs/current/gist.html
brin-index:
  term: BRIN-индекс
  def: >-
    Индекс диапазонов блоков (Block Range Index): хранит минимум и максимум для каждой группы соседних страниц таблицы. Очень маленький, но полезен, только если значения коррелируют с физическим порядком строк, как время в журнале.
  q: PostgreSQL BRIN index
  docs: https://www.postgresql.org/docs/current/brin.html
partial-index:
  term: Частичный индекс (partial index)
  def: >-
    Индекс только по строкам, удовлетворяющим условию `WHERE` в его определении. Меньше полного и используется запросами с совместимым условием; аналог фильтрованного индекса SQL Server.
  q: PostgreSQL partial index
  docs: https://www.postgresql.org/docs/current/indexes-partial.html
expression-index:
  term: Индекс по выражению (expression index)
  def: >-
    Индекс по результату выражения или функции, например `lower(email)`. Используется, только если запрос содержит то же выражение; в SQL Server для этого нужен вычисляемый столбец.
  q: PostgreSQL expression index
  docs: https://www.postgresql.org/docs/current/indexes-expressional.html
jsonb:
  term: jsonb
  def: >-
    Тип PostgreSQL для JSON в разобранном двоичном виде: без дублей ключей и исходного порядка, зато с операторами поиска (`@>`, `?`, `@?`) и поддержкой GIN-индексов. Тип `json`, наоборот, хранит исходный текст.
  q: PostgreSQL jsonb
  docs: https://www.postgresql.org/docs/current/datatype-json.html
jsonpath:
  term: jsonpath (SQL/JSON path)
  def: >-
    Язык путей из стандарта SQL/JSON для выбора и фильтрации значений внутри JSON, например `$.items[*] ? (@.price > 10)`. В PostgreSQL его понимают операторы `@?`, `@@` и функции `jsonb_path_query`, `JSON_VALUE`, `JSON_EXISTS`.
  q: PostgreSQL jsonpath
  docs: https://www.postgresql.org/docs/current/datatype-json.html#DATATYPE-JSONPATH
toast:
  term: TOAST
  def: >-
    Механизм хранения больших значений в PostgreSQL: если строка шире ~2 КБ, крупные поля сжимаются и выносятся в отдельную служебную таблицу. Изменение такого значения переписывает его целиком.
  q: PostgreSQL TOAST
  docs: https://www.postgresql.org/docs/current/storage-toast.html
eav:
  term: EAV (entity–attribute–value)
  def: >-
    Схема, в которой атрибуты хранятся строками вида «сущность, имя атрибута, значение» вместо отдельных колонок. Гибкая, но неудобная для запросов и без типизации; JSONB часто заменяет её.
  q: entity attribute value model
explain-analyze:
  term: EXPLAIN ANALYZE
  def: >-
    Команда PostgreSQL, которая выполняет запрос и выводит план с фактическими временем, числом строк и проходов на каждом узле. С опцией `BUFFERS` (с версии 18 — по умолчанию) показывает и чтения страниц.
  q: PostgreSQL EXPLAIN ANALYZE BUFFERS
  docs: https://www.postgresql.org/docs/current/using-explain.html
pg-stat-statements:
  term: pg_stat_statements
  def: >-
    Расширение PostgreSQL, которое копит статистику выполнения по нормализованным запросам: вызовы, суммарное и среднее время, строки, чтения блоков. Ближайший аналог Query Store, но без хранения планов.
  q: pg_stat_statements
  docs: https://www.postgresql.org/docs/current/pgstatstatements.html
work-mem:
  term: work_mem
  def: >-
    Параметр PostgreSQL: сколько памяти может занять одна операция сортировки или хеширования, прежде чем уйти на диск. Выделяется на каждую такую операцию в каждом соединении, поэтому большие значения задают точечно.
  q: PostgreSQL work_mem
  docs: https://www.postgresql.org/docs/current/runtime-config-resource.html#GUC-WORK-MEM
auto-explain:
  term: auto_explain
  def: >-
    Модуль PostgreSQL, который автоматически пишет в лог планы запросов дольше заданного порога (`auto_explain.log_min_duration`). Позволяет увидеть план медленного запроса в проде без ручного запуска.
  q: PostgreSQL auto_explain
  docs: https://www.postgresql.org/docs/current/auto-explain.html
pgbouncer:
  term: PgBouncer
  def: >-
    Лёгкий внешний пул соединений для PostgreSQL. В режиме `transaction` отдаёт клиенту серверное соединение только на время транзакции, поэтому тысячи клиентских соединений обслуживает небольшое число серверных процессов.
  q: PgBouncer transaction pooling
  docs: https://www.pgbouncer.org/features.html
xmin-horizon:
  term: Горизонт xmin (xmin horizon)
  def: >-
    Номер самой старой транзакции, чей снимок ещё может понадобиться: открытой транзакции, слота репликации или реплики. VACUUM не удаляет версии строк новее горизонта, поэтому одна долгая транзакция вызывает bloat во всей базе.
  q: PostgreSQL xmin horizon long running transaction vacuum
  docs: https://www.postgresql.org/docs/current/routine-vacuuming.html
