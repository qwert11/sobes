dependency-injection:
  term: Внедрение зависимостей (dependency injection, DI)
  def: >-
    Приём, при котором объект получает свои зависимости снаружи, обычно через конструктор, а не
    создаёт их сам. В ASP.NET Core зависимости создаёт и передаёт встроенный контейнер.
  q: dependency injection ASP.NET Core
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/overview
  wiki: Внедрение зависимости
di-container:
  term: DI-контейнер (контейнер служб)
  def: >-
    Объект, который по зарегистрированным правилам создаёт сервисы, передаёт им зависимости и
    управляет их временем жизни. В .NET регистрации собирают в `IServiceCollection`, а контейнер —
    это `IServiceProvider`.
  q: .NET IServiceProvider service container
  docs: https://learn.microsoft.com/dotnet/api/system.iserviceprovider
dependency-inversion:
  term: Принцип инверсии зависимостей (DIP)
  def: >-
    Буква D в SOLID: модули верхнего уровня не зависят от модулей нижнего уровня, оба зависят от
    абстракций. Внедрение зависимостей — практический способ его соблюдать.
  q: dependency inversion principle
  docs: https://learn.microsoft.com/dotnet/architecture/modern-web-apps-azure/architectural-principles#dependency-inversion
  wiki: Принцип инверсии зависимостей
constructor-injection:
  term: Внедрение через конструктор (constructor injection)
  def: >-
    Способ DI, при котором зависимости приходят параметрами конструктора. Все зависимости класса
    видны в его сигнатуре, а объект не может существовать без них.
  q: constructor injection C#
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/overview#constructor-injection-behavior
inversion-of-control:
  term: Инверсия управления (inversion of control, IoC)
  def: >-
    Принцип, по которому управление потоком программы или созданием объектов передаётся
    фреймворку: не ваш код вызывает библиотеку, а фреймворк вызывает ваш код. DI — частный случай
    IoC.
  q: inversion of control
  wiki: Инверсия управления
service-locator:
  term: Service Locator (локатор служб)
  def: >-
    Паттерн, при котором класс сам запрашивает зависимости у глобального реестра, например через
    `IServiceProvider.GetService`. При DI его считают антипаттерном: зависимости не видны в
    конструкторе, а ошибки переезжают в рантайм.
  q: service locator anti-pattern
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/guidelines#recommendations
service-lifetime:
  term: Время жизни сервиса (service lifetime)
  def: >-
    Правило, по которому контейнер решает, когда создать новый экземпляр сервиса и когда его
    освободить. В .NET три варианта — Transient, Scoped и Singleton.
  q: .NET service lifetimes transient scoped singleton
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/service-lifetimes
di-scope:
  term: Scope (область DI)
  def: >-
    Область, внутри которой scoped-сервисы существуют в одном экземпляре и в конце которой
    контейнер освобождает созданные в ней объекты. В ASP.NET Core scope создаётся на каждый
    HTTP-запрос.
  q: IServiceScope .NET
  docs: https://learn.microsoft.com/dotnet/api/microsoft.extensions.dependencyinjection.iservicescope
root-provider:
  term: Корневой провайдер (root service provider)
  def: >-
    `IServiceProvider`, который создаёт `builder.Build()`. Живёт всё время работы приложения, хранит
    singleton-сервисы и освобождает их при остановке.
  q: root service provider scope validation
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/overview#scope-validation
captive-dependency:
  term: Captive dependency (захваченная зависимость)
  def: >-
    Ошибка конфигурации, при которой долгоживущий сервис держит зависимость с более коротким
    временем жизни, например singleton держит scoped-сервис. Зависимость начинает жить столько же,
    сколько её владелец.
  q: captive dependency
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/guidelines#captive-dependency
scope-validation:
  term: Проверка scope (ValidateScopes)
  def: >-
    Опция `ServiceProviderOptions`, при которой контейнер запрещает разрешать scoped-сервисы из
    корневого провайдера и внедрять их в singleton. По умолчанию включена в окружении Development.
  q: ValidateScopes ASP.NET Core
  docs: https://learn.microsoft.com/dotnet/api/microsoft.extensions.dependencyinjection.serviceprovideroptions.validatescopes
validate-on-build:
  term: ValidateOnBuild
  def: >-
    Опция `ServiceProviderOptions`, при которой контейнер ещё при `Build()` проверяет, что каждый
    зарегистрированный сервис можно создать. Открытые generic-регистрации не проверяет; по умолчанию
    включена в Development.
  q: ValidateOnBuild .NET
  docs: https://learn.microsoft.com/dotnet/api/microsoft.extensions.dependencyinjection.serviceprovideroptions.validateonbuild
implementation-factory:
  term: Фабрика регистрации (implementation factory)
  def: >-
    Делегат `Func<IServiceProvider, T>`, который передают в `AddSingleton`, `AddScoped` или
    `AddTransient` вместо типа реализации. Контейнер вызывает его, чтобы создать сервис, и
    освобождает возвращённый объект как созданный им самим.
  q: AddSingleton implementation factory
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/service-registration
service-scope-factory:
  term: IServiceScopeFactory
  def: >-
    Singleton-сервис, который создаёт новые scopes. Через него singleton и фоновые задачи получают
    scoped-сервисы: `CreateScope()` или, с .NET 6, `CreateAsyncScope()`.
  q: IServiceScopeFactory CreateAsyncScope
  docs: https://learn.microsoft.com/dotnet/api/microsoft.extensions.dependencyinjection.iservicescopefactory
background-service:
  term: BackgroundService
  def: >-
    Базовый класс для долгоживущей фоновой работы в хосте .NET: логику пишут в `ExecuteAsync`, а
    регистрируют через `AddHostedService`, то есть как singleton.
  q: BackgroundService .NET
  docs: https://learn.microsoft.com/dotnet/api/microsoft.extensions.hosting.backgroundservice
unit-of-work:
  term: Единица работы (unit of work)
  def: >-
    Набор операций, которые выполняются и сохраняются вместе, как одна бизнес-транзакция. В EF Core
    единицу работы представляет экземпляр `DbContext`.
  q: unit of work pattern
  docs: https://martinfowler.com/eaaCatalog/unitOfWork.html
keyed-services:
  term: Keyed services (сервисы с ключом)
  def: >-
    Регистрации с ключом, появившиеся в .NET 8: `AddKeyedSingleton`, `AddKeyedScoped`,
    `AddKeyedTransient`. Нужную реализацию получают атрибутом `[FromKeyedServices(key)]` или методом
    `GetRequiredKeyedService`.
  q: .NET 8 keyed services
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/overview#keyed-services
try-add:
  term: TryAdd и TryAddEnumerable
  def: >-
    Методы регистрации из `Microsoft.Extensions.DependencyInjection.Extensions`. `TryAdd*` добавляет
    сервис, только если он ещё не зарегистрирован, `TryAddEnumerable` — если нет такой же пары
    «сервис и реализация».
  q: TryAddEnumerable vs TryAdd
  docs: https://learn.microsoft.com/dotnet/api/microsoft.extensions.dependencyinjection.extensions.servicecollectiondescriptorextensions.tryaddenumerable
decorator-pattern:
  term: Декоратор (decorator)
  def: >-
    Паттерн, при котором объект оборачивает другой объект с тем же интерфейсом и добавляет поведение
    до или после вызова: кеш, логирование, повторы. Встроенный контейнер .NET декораторы не
    поддерживает.
  q: decorator pattern dependency injection .NET
  wiki: Декоратор (шаблон проектирования)
scrutor:
  term: Scrutor
  def: >-
    Библиотека расширений для встроенного контейнера .NET: сканирование сборок с регистрацией по
    соглашениям (`Scan`) и декораторы (`Decorate`).
  q: Scrutor Decorate Scan
  docs: https://github.com/khellang/Scrutor
composition-root:
  term: Composition root (корень композиции)
  def: >-
    Единственное место приложения, где собирается граф объектов: регистрации сервисов и выбор
    реализаций. В ASP.NET Core это `Program.cs` и методы расширения `Add...`, которые он вызывает.
  q: composition root dependency injection
  docs: https://blog.ploeh.dk/2011/07/28/CompositionRoot/
disposable-transient:
  term: Disposable transient
  def: >-
    Transient-сервис, реализующий `IDisposable` или `IAsyncDisposable`. Контейнер хранит ссылку на
    каждый такой экземпляр до конца scope, поэтому при разрешении из корня они копятся до остановки
    приложения.
  q: disposable transient services captured by container
  docs: https://learn.microsoft.com/dotnet/core/extensions/dependency-injection/guidelines#disposable-transient-services-captured-by-container
autofac:
  term: Autofac
  def: >-
    Популярный сторонний DI-контейнер для .NET. Подключается к ASP.NET Core через
    `UseServiceProviderFactory` и добавляет модули, декораторы, внедрение через свойства и scope с
    тегами.
  q: Autofac ASP.NET Core
  docs: https://autofac.readthedocs.io/en/latest/integration/aspnetcore.html
property-injection:
  term: Внедрение через свойства (property injection)
  def: >-
    Способ DI, при котором контейнер присваивает зависимости публичным свойствам уже созданного
    объекта. Встроенный контейнер .NET его не поддерживает, Autofac — поддерживает.
  q: property injection C#
activator-utilities:
  term: ActivatorUtilities
  def: >-
    Вспомогательный класс, который создаёт объект незарегистрированного типа, беря параметры
    конструктора из `IServiceProvider`. Созданным объектом владеет вызывающий код, а не контейнер.
  q: ActivatorUtilities.CreateInstance
  docs: https://learn.microsoft.com/dotnet/api/microsoft.extensions.dependencyinjection.activatorutilities
