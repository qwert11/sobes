space-complexity:
  term: Сложность по памяти (space complexity)
  def: >-
    Оценка того, сколько дополнительной памяти требует алгоритм с ростом входа n, без учёта самого входа. Проход с `HashSet<T>` — O(n) памяти, двойной цикл без коллекций — O(1).
  q: space complexity algorithm
worst-case:
  term: Худший случай (worst case)
  def: >-
    Оценка сложности на самом неудачном входе данного размера. Даёт гарантию для любого ввода: quicksort в среднем O(n log n), но в худшем случае O(n²).
  q: worst case complexity
  wiki: Вычислительная сложность
master-theorem:
  term: Основная теорема о рекуррентных соотношениях (master theorem)
  def: >-
    Готовый ответ для рекуррентных соотношений вида T(n) = a·T(n/b) + f(n), которые описывают алгоритмы «разделяй и властвуй». Например, сортировка слиянием T(n) = 2T(n/2) + O(n) даёт O(n log n).
  q: master theorem algorithms
  wiki: Основная теорема о рекуррентных соотношениях
binary-search-tree:
  term: Двоичное дерево поиска (binary search tree)
  def: >-
    Дерево, где у каждого узла ключи слева меньше, а справа больше. Поиск, вставка и удаление стоят O(высоты): O(log n) у сбалансированного дерева и O(n) у вырожденного.
  q: binary search tree
  wiki: Двоичное дерево поиска
binary-heap:
  term: Двоичная куча (binary heap)
  def: >-
    Дерево, хранящееся в массиве, где каждый родитель не больше своих потомков, поэтому минимум лежит в корне. Вставка и извлечение минимума — O(log n). В .NET на куче построен `PriorityQueue<TElement, TPriority>`.
  q: binary heap priority queue
  docs: https://learn.microsoft.com/dotnet/api/system.collections.generic.priorityqueue-2
  wiki: Двоичная куча
graph:
  term: Граф (graph)
  def: >-
    Набор вершин и рёбер между ними: города и дороги, задачи и зависимости, пользователи и связи. Рёбра бывают направленными и взвешенными; готового типа графа в .NET нет.
  q: graph data structure
  wiki: Граф (математика)
adjacency-list:
  term: Список смежности (adjacency list)
  def: >-
    Способ хранить граф: для каждой вершины — список её соседей, в C# обычно `Dictionary<T, List<T>>`. Занимает O(V + E) памяти и подходит для разреженных графов.
  q: adjacency list graph
  wiki: Список смежности
binary-search:
  term: Бинарный поиск (binary search)
  def: >-
    Поиск в отсортированном массиве делением диапазона пополам: сравнить с серединой и отбросить половину, где элемента быть не может. Работает за O(log n); в .NET — `Array.BinarySearch` и `List<T>.BinarySearch`.
  q: binary search algorithm
  docs: https://learn.microsoft.com/dotnet/api/system.array.binarysearch
  wiki: Двоичный поиск
quicksort:
  term: Быстрая сортировка (quicksort)
  def: >-
    Сортировка, которая выбирает опорный элемент, раскладывает остальные на меньшие и большие и рекурсивно сортирует части. В среднем O(n log n) на месте, в худшем O(n²); нестабильная.
  q: quicksort algorithm
  wiki: Быстрая сортировка
merge-sort:
  term: Сортировка слиянием (merge sort)
  def: >-
    Сортировка, которая делит массив пополам, сортирует половины и сливает их. Всегда O(n log n) и стабильна, но требует O(n) дополнительной памяти.
  q: merge sort algorithm
  wiki: Сортировка слиянием
stable-sort:
  term: Стабильная сортировка (stable sort)
  def: >-
    Сортировка, которая сохраняет исходный порядок элементов с равными ключами. `Enumerable.OrderBy` стабилен, а `Array.Sort` и `List<T>.Sort` — нет.
  q: stable sorting algorithm
  wiki: Устойчивая сортировка
heapsort:
  term: Пирамидальная сортировка (heapsort)
  def: >-
    Сортировка, которая строит кучу из массива и раз за разом извлекает из неё крайний элемент. O(n log n) в худшем случае и O(1) дополнительной памяти, но нестабильная.
  q: heapsort algorithm
  wiki: Пирамидальная сортировка
introsort:
  term: Интроспективная сортировка (introsort)
  def: >-
    Гибридная сортировка в `Array.Sort`: quicksort, который на маленьких участках переключается на вставки, а при слишком глубоком разбиении — на heapsort. Даёт O(n log n) в худшем случае, нестабильна.
  q: introsort .NET Array.Sort
  docs: https://learn.microsoft.com/dotnet/api/system.array.sort
  wiki: Introsort
recursion:
  term: Рекурсия (recursion)
  def: >-
    Приём, при котором функция вызывает саму себя для меньшей подзадачи. Нужны базовый случай без рекурсии и шаг, который к нему приближает; каждый вызов занимает кадр стека.
  q: recursion programming
  wiki: Рекурсия
dynamic-programming:
  term: Динамическое программирование (dynamic programming)
  def: >-
    Метод решения задач, которые складываются из перекрывающихся подзадач: ответ каждой подзадачи вычисляют один раз и переиспользуют. Превращает экспоненциальный перебор в полиномиальный алгоритм.
  q: dynamic programming
  wiki: Динамическое программирование
memoization:
  term: Мемоизация (memoization)
  def: >-
    Кеширование результатов функции по аргументам: повторный вызов с теми же аргументами берёт ответ из словаря или массива. Это ДП сверху вниз — рекурсия плюс кеш.
  q: memoization
  wiki: Мемоизация
tabulation:
  term: Табуляция (tabulation)
  def: >-
    ДП снизу вверх: таблицу ответов заполняют циклом от базовых случаев к целевому, без рекурсии. Позволяет хранить только последние строки таблицы и экономить память.
  q: dynamic programming tabulation bottom-up
tail-call:
  term: Хвостовой вызов (tail call)
  def: >-
    Вызов, который стоит последним действием функции, поэтому её кадр стека можно переиспользовать. Компилятор C# такую оптимизацию не гарантирует, поэтому глубокую рекурсию в C# переписывают циклом.
  q: tail call optimization C#
  wiki: Хвостовая рекурсия
two-pointers:
  term: Два указателя (two pointers)
  def: >-
    Приём, при котором два индекса движутся по массиву навстречу друг другу или в одну сторону. Решает задачи на отсортированных массивах за O(n) и O(1) памяти: пара с заданной суммой, палиндром, слияние.
  q: two pointers technique
sliding-window:
  term: Скользящее окно (sliding window)
  def: >-
    Приём для задач о подотрезках: окно [left, right] расширяется вправо и сжимается слева, когда нарушено условие. Каждый индекс сдвигается не больше одного раза, поэтому O(n).
  q: sliding window technique
prefix-sum:
  term: Префиксные суммы (prefix sums)
  def: >-
    Массив, где элемент i — сумма первых i элементов исходного. После подготовки за O(n) сумма любого отрезка считается за O(1) как разность двух префиксов.
  q: prefix sum array
  wiki: Префиксная сумма
bfs:
  term: Поиск в ширину (BFS, breadth-first search)
  def: >-
    Обход графа слоями через очередь: сначала все соседи, потом соседи соседей. Находит кратчайший путь по числу рёбер в невзвешенном графе за O(V + E).
  q: breadth-first search
  wiki: Поиск в ширину
dfs:
  term: Поиск в глубину (DFS, depth-first search)
  def: >-
    Обход графа, который идёт по одной ветви до конца и возвращается назад, через рекурсию или явный стек. O(V + E); основа для поиска циклов, компонент связности и топологической сортировки.
  q: depth-first search
  wiki: Поиск в глубину
topological-sort:
  term: Топологическая сортировка (topological sort)
  def: >-
    Упорядочивание вершин ориентированного графа без циклов так, чтобы каждое ребро шло от более ранней вершины к более поздней. Алгоритм Кана делает это за O(V + E) и заодно находит циклы.
  q: topological sort Kahn algorithm
  wiki: Топологическая сортировка
