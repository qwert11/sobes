box-model:
  term: Блочная модель (box model)
  def: >-
    Представление каждого элемента в CSS как прямоугольника из содержимого, внутреннего отступа
    (padding), рамки (border) и внешнего отступа (margin). Что входит в `width`, задаёт `box-sizing`.
  q: CSS box model
  docs: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Box_model/Introduction
flexbox:
  term: Flexbox
  def: >-
    Модуль раскладки CSS для одной оси: дети контейнера с `display: flex` выстраиваются в строку
    или колонку и делят свободное место по `flex-grow` и `flex-shrink`.
  q: CSS flexbox basic concepts
  docs: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Flexible_box_layout/Basic_concepts
css-grid:
  term: CSS Grid
  def: >-
    Модуль раскладки CSS для двух осей: контейнер с `display: grid` задаёт строки и колонки,
    а дети занимают ячейки и области сетки.
  q: CSS grid layout
  docs: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Grid_layout
css-specificity:
  term: Специфичность селектора (specificity)
  def: >-
    Вес селектора в каскаде — тройка «id, классы и атрибуты и псевдоклассы, теги и псевдоэлементы».
    При равном происхождении и слое побеждает правило с большей специфичностью.
  q: CSS specificity
  docs: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Cascade/Specificity
media-query:
  term: Медиазапрос (media query)
  def: >-
    Условие `@media`, при котором применяются стили: ширина окна, ориентация, тип устройства,
    тёмная тема. Основа адаптивной вёрстки.
  q: CSS media queries
  docs: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Media_queries/Using
container-query:
  term: Контейнерный запрос (container query)
  def: >-
    Условие `@container`, которое проверяет размер ближайшего предка с `container-type`, а не окна.
    Позволяет компоненту подстраиваться под место, куда его поставили.
  q: CSS container queries
  docs: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Containment/Container_queries
screen-reader:
  term: Скринридер (screen reader)
  def: >-
    Программа, которая озвучивает интерфейс или выводит его на брайлевский дисплей: NVDA, JAWS,
    VoiceOver, TalkBack. Читает дерево доступности, а не пиксели.
  q: screen reader web accessibility
  docs: https://developer.mozilla.org/en-US/docs/Glossary/Screen_reader
semantic-html:
  term: Семантический HTML
  def: >-
    Разметка элементами по смыслу: `button`, `nav`, `main`, `label`, заголовки — вместо `div` и `span`.
    Даёт роль, поведение клавиатуры и структуру для скринридеров без дополнительного кода.
  q: semantic HTML accessibility
  docs: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Accessibility/HTML
accessibility-tree:
  term: Дерево доступности (accessibility tree)
  def: >-
    Структура, которую браузер строит из DOM для вспомогательных технологий: у каждого узла есть роль,
    доступное имя, описание и состояние.
  q: accessibility tree browser
  docs: https://developer.mozilla.org/en-US/docs/Glossary/Accessibility_tree
wai-aria:
  term: WAI-ARIA
  def: >-
    Спецификация W3C с атрибутами `role` и `aria-*`, которые дополняют дерево доступности там, где
    HTML не хватает семантики. Меняет только то, что слышит скринридер, но не поведение элемента.
  q: WAI-ARIA basics
  docs: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA
wcag:
  term: WCAG (Web Content Accessibility Guidelines)
  def: >-
    Стандарт W3C с проверяемыми критериями доступности уровней A, AA и AAA. Актуальная версия — WCAG 2.2
    (октябрь 2023); законы обычно требуют уровень AA.
  q: WCAG 2.2
  docs: https://www.w3.org/TR/WCAG22/
european-accessibility-act:
  term: Европейский акт о доступности (European Accessibility Act, EAA)
  def: >-
    Директива ЕС 2019/882, которая с 28 июня 2025 года требует доступности ряда продуктов и услуг:
    интернет-магазинов, банков, транспорта, электронных книг. Техническая опора — EN 301 549.
  q: European Accessibility Act
  docs: https://eur-lex.europa.eu/eli/dir/2019/882/oj
cssom:
  term: CSSOM (CSS Object Model)
  def: >-
    Дерево правил, которое браузер строит из всех стилей страницы. Вместе с DOM оно нужно, чтобы
    построить дерево отрисовки, поэтому CSS блокирует первый показ страницы.
  q: CSSOM CSS object model
  docs: https://developer.mozilla.org/en-US/docs/Web/API/CSS_Object_Model
critical-rendering-path:
  term: Критический путь отрисовки (critical rendering path)
  def: >-
    Шаги браузера от получения HTML до первого кадра: DOM, CSSOM, дерево отрисовки, layout, paint,
    composite. Его длину определяют блокирующие CSS и скрипты.
  q: critical rendering path
  docs: https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/Critical_rendering_path
render-blocking-resource:
  term: Блокирующий ресурс (render-blocking resource)
  def: >-
    Ресурс, без которого браузер не начнёт отрисовку: стили в `head` и синхронные скрипты. Скрипты
    с `defer`, `async` и модули не блокируют.
  q: render-blocking resources
  docs: https://developer.mozilla.org/en-US/docs/Glossary/Render_blocking
reflow:
  term: Reflow (пересчёт раскладки)
  def: >-
    Повторный расчёт размеров и положения элементов (layout) после изменения геометрии или DOM.
    Дороже repaint, который только перерисовывает пиксели.
  q: reflow repaint browser
  docs: https://developer.mozilla.org/en-US/docs/Glossary/Reflow
layout-thrashing:
  term: Layout thrashing
  def: >-
    Чередование записи стилей и чтения геометрии (`offsetHeight`, `getBoundingClientRect`), при котором
    браузер синхронно пересчитывает layout на каждом чтении.
  q: layout thrashing forced synchronous layout
  docs: https://web.dev/articles/avoid-large-complex-layouts-and-layout-thrashing
compositing:
  term: Композитинг (compositing)
  def: >-
    Сборка кадра из готовых слоёв в отдельном потоке композитора. Изменения `transform` и `opacity`
    слоя обходятся без layout и paint.
  q: browser compositing layers
  docs: https://web.dev/articles/stick-to-compositor-only-properties-and-manage-layer-count
core-web-vitals:
  term: Core Web Vitals
  def: >-
    Три метрики Google для пользовательского опыта: LCP (скорость загрузки), INP (отклик) и CLS
    (стабильность вёрстки). Оцениваются по 75-му перцентилю реальных визитов.
  q: Core Web Vitals
  docs: https://web.dev/articles/vitals
lcp:
  term: LCP (Largest Contentful Paint)
  def: >-
    Время от начала навигации до отрисовки самого крупного изображения или текстового блока
    в области просмотра. Хорошо — до 2,5 секунды.
  q: Largest Contentful Paint
  docs: https://web.dev/articles/lcp
inp:
  term: INP (Interaction to Next Paint)
  def: >-
    Задержка от клика, касания или нажатия клавиши до следующего кадра, худшая за визит. Хорошо —
    до 200 мс. В марте 2024 года заменила FID в Core Web Vitals.
  q: Interaction to Next Paint
  docs: https://web.dev/articles/inp
cls:
  term: CLS (Cumulative Layout Shift)
  def: >-
    Мера неожиданных сдвигов вёрстки: самая большая серия сдвигов за время жизни страницы.
    Хорошо — до 0,1.
  q: Cumulative Layout Shift
  docs: https://web.dev/articles/cls
real-user-monitoring:
  term: RUM (real user monitoring)
  def: >-
    Сбор метрик производительности в браузерах реальных пользователей и отправка их в аналитику.
    Даёт полевые данные в отличие от лабораторных замеров Lighthouse.
  q: real user monitoring web performance
  docs: https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/Rum-vs-Synthetic
code-splitting:
  term: Разделение кода (code splitting)
  def: >-
    Разбиение бандла на части, которые загружаются по требованию через динамический `import()`:
    по маршрутам или по редко используемым функциям. Уменьшает стартовый объём JS.
  q: code splitting dynamic import
  docs: https://developer.mozilla.org/en-US/docs/Glossary/Code_splitting
