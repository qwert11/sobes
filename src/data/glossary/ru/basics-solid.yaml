solid:
  term: SOLID
  def: >-
    Пять принципов объектного проектирования, собранных Робертом Мартином: единственная
    ответственность, открытость/закрытость, подстановка Лисков, разделение интерфейсов и инверсия
    зависимостей. Аббревиатуру предложил Майкл Фэзерс.
  q: SOLID principles
  wiki: SOLID (программирование)
single-responsibility:
  term: Принцип единственной ответственности (SRP)
  def: >-
    Буква S в SOLID: у модуля одна причина для изменения. В формулировке Мартина из «Clean
    Architecture» — модуль отвечает перед одним актором, то есть перед одной группой людей, которые
    просят изменений.
  q: single responsibility principle Robert Martin actor
  docs: https://blog.cleancoder.com/uncle-bob/2014/05/08/SingleReponsibilityPrinciple.html
  wiki: Принцип единственной ответственности
open-closed:
  term: Принцип открытости/закрытости (OCP)
  def: >-
    Буква O в SOLID: модуль открыт для расширения и закрыт для изменения. Сформулирован Бертраном
    Мейером в 1988 году; Мартин достигает его через абстракции и полиморфизм.
  q: open closed principle
  docs: https://blog.cleancoder.com/uncle-bob/2014/05/12/TheOpenClosedPrinciple.html
  wiki: Принцип открытости/закрытости
dry:
  term: DRY (Don't Repeat Yourself)
  def: >-
    Принцип из книги «The Pragmatic Programmer» (1999): каждое знание должно иметь единственное,
    однозначное, авторитетное представление в системе. Касается знаний и правил, а не одинаковых
    строк кода.
  q: DRY principle knowledge Pragmatic Programmer
  docs: https://learn.microsoft.com/dotnet/architecture/modern-web-apps-azure/architectural-principles#dont-repeat-yourself-dry
kiss:
  term: KISS (Keep It Simple, Stupid)
  def: >-
    Принцип инженерной простоты: из работающих решений выбирать самое простое. Фразу приписывают
    Келли Джонсону, инженеру Lockheed.
  q: KISS principle software
yagni:
  term: YAGNI (You Aren't Gonna Need It)
  def: >-
    Правило экстремального программирования: не реализовывать функциональность, пока она не нужна.
    Не запрещает рефакторинг и тесты, которые упрощают будущие изменения.
  q: YAGNI Martin Fowler
  docs: https://martinfowler.com/bliki/Yagni.html
  wiki: YAGNI
rule-of-three:
  term: Правило трёх (rule of three)
  def: >-
    Эвристика рефакторинга: два похожих фрагмента терпят, на третьем выносят общее. Приписывается
    Дону Робертсу, популяризирована Мартином Фаулером в книге «Рефакторинг».
  q: rule of three refactoring
design-by-contract:
  term: Контракт (design by contract)
  def: >-
    Описание поведения метода через предусловия (что верно до вызова), постусловия (что
    гарантировано после) и инварианты (что верно всегда). Подход Бертрана Мейера; на нём держится
    LSP.
  q: design by contract preconditions postconditions invariants
  wiki: Контрактное программирование
interface-segregation:
  term: Принцип разделения интерфейсов (ISP)
  def: >-
    Буква I в SOLID: клиент не должен зависеть от методов, которыми не пользуется. Широкий
    интерфейс делят на несколько узких по нуждам клиентов.
  q: interface segregation principle
  wiki: Принцип разделения интерфейса
role-interface:
  term: Ролевой интерфейс (role interface)
  def: >-
    Интерфейс, который описывает одну роль объекта для конкретного клиента, а не все его публичные
    методы. Противоположность — заголовочный интерфейс (header interface), копирующий класс целиком.
  q: role interface Martin Fowler
  docs: https://martinfowler.com/bliki/RoleInterface.html
speculative-generality:
  term: Спекулятивная общность (speculative generality)
  def: >-
    Запах кода из каталога Фаулера: абстракции, параметры и хуки «на будущее», которыми никто не
    пользуется. Лечится удалением лишнего.
  q: speculative generality code smell
accidental-complexity:
  term: Случайная сложность (accidental complexity)
  def: >-
    Сложность, которую вносит решение, а не задача: лишние слои, абстракции, инструменты.
    Противопоставлена существенной сложности в эссе Фреда Брукса «No Silver Bullet» (1986).
  q: accidental vs essential complexity Brooks
cupid:
  term: CUPID
  def: >-
    Свойства «приятного» кода, предложенные Дэном Нортом как альтернатива SOLID: Composable, Unix
    philosophy, Predictable, Idiomatic, Domain-based. Это свойства, к которым код приближается, а не
    правила, которые он соблюдает.
  q: CUPID Dan North
  docs: https://dannorth.net/blog/cupid-for-joyful-coding/
